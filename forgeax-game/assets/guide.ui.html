<div class="hud" data-ui-part="hud">
  <div class="topline" data-ui-part="topline">
    <span data-ui-part="time">60</span>
    <span class="divider" aria-hidden="true"></span>
    <span data-ui-part="kills">0</span>
  </div>
  <div class="crosshair" data-ui-part="crosshair" aria-hidden="true"></div>
  <div class="ammo" data-ui-part="ammo">20</div>
  <div class="vignette" data-ui-part="vignette" aria-hidden="true"></div>
  <div class="overlay" data-ui-part="overlay">
    <div class="brand">NO-ART-FPS</div>
    <div class="countdown" data-ui-part="countdown"></div>
    <div class="result" data-ui-part="result">
      <strong data-ui-part="result-kills">0</strong>
      <span class="result-label">KILLS</span>
      <small data-ui-part="result-best">BEST 0</small>
    </div>
    <div class="prompt" data-ui-part="prompt">CLICK TO PLAY</div>
    <div class="maps" data-ui-part="maps">
      <button type="button" data-ui-part="map-sandgate">SANDGATE</button>
      <button type="button" data-ui-part="map-bb_office">BB OFFICE</button>
    </div>
    <button type="button" data-ui-part="restart" hidden>RUN AGAIN</button>
  </div>
</div>
