<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#29395a">
  <meta name="description" content="No-Art-FPS — 60 秒击杀冲刺。pixelcao 的明亮低多边形 FPS 小品。" data-i18n-content>
  <title>No-Art-FPS · pixelcao</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="title-background.webp" as="image">
  <link rel="preload" href="Rajdhani-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:Rajdhani;src:url('Rajdhani-Bold.woff2') format('woff2');font-weight:700;font-display:block}
    @font-face{font-family:GlowSansSC;src:url('GlowSansSC-UI.woff2') format('woff2');font-weight:400 900;font-display:swap}
    :root{--sky-tint:#29395a;--title-margin:clamp(30px,4vw,64px);--title-left:calc(env(safe-area-inset-left) + var(--title-margin));--title-right:calc(env(safe-area-inset-right) + var(--title-margin));--title-top:calc(env(safe-area-inset-top) + var(--title-margin));--title-bottom:calc(env(safe-area-inset-bottom) + var(--title-margin))}
    @media(max-height:500px){:root{--title-margin:clamp(22px,3.4vw,32px)}}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--sky-tint);color:#fff5d3;font-family:Arial,GlowSansSC,"PingFang SC",sans-serif;overflow:hidden}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e9ba50;outline-offset:5px}
    .ui-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;pointer-events:none}.touch-button .ui-icon{width:26px;height:26px}
    #canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #title-safe-area{position:fixed;inset:var(--title-top) var(--title-right) var(--title-bottom) var(--title-left);visibility:hidden;pointer-events:none}
    #sky-edge{position:fixed;inset:0 0 auto;height:max(2px,env(safe-area-inset-top));background:var(--sky-tint);pointer-events:none;z-index:6}
    #loading{position:fixed;inset:0;background:#000;z-index:5;transition:opacity .18s}
    #loading[hidden]{display:none}#loading.leaving{opacity:0;pointer-events:none}
    #loader-scene{display:block;width:100%;height:100%;font-family:Rajdhani,sans-serif;font-weight:700;fill:white}
    #loader-cartridges{transition:opacity .12s,transform .12s;transform-box:fill-box;transform-origin:center}
    #loader-fire{opacity:0;transition:opacity .12s}
    #loading.loaded #loader-cartridges{opacity:0;transform:translateY(4px)}#loading.loaded #loader-fire{opacity:1}
    .loader-status{position:absolute;left:0;bottom:0;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
    #loading.error .loader-status,.loader-noscript{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:min(480px,90%);height:auto;clip-path:none;white-space:normal;text-align:center;padding:16px;background:#243440;font-size:16px;line-height:1.5}
    #retry{display:block;margin:12px auto 0;border:0;background:#754c87;color:white;padding:10px 22px}#retry[hidden]{display:none}
    #help{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));color:#fff5d3;background:#243440ce;border:1px solid #fff5d340;padding:8px 12px;font-size:12px;z-index:2;max-width:calc(100% - 32px);text-align:center}
    #help[hidden],body[data-game=TITLE] #help{display:none}.mobile-warning{display:none}@media(pointer:coarse){.desktop-controls{display:none}.mobile-warning{display:inline}}

    body.mobile .desktop-controls{display:none}body.mobile .mobile-warning{display:inline}
    body{height:100dvh;overscroll-behavior:none}body.mobile #help{display:none}
    #rotate{position:fixed;inset:0;z-index:20;background:#243440;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;gap:18px;flex-direction:column}
    body.mobile.portrait #loading[hidden]~#rotate{display:flex}#rotate svg{width:100px;height:100px;stroke:#e9ba50;fill:none;stroke-width:3}
    #rotate .rotate-gyro,#rotate:has(~#gyro-panel[data-step=setup]:not([hidden])) :is(.rotate-game,small){display:none}
    #rotate:has(~#gyro-panel[data-step=setup]:not([hidden])) .rotate-gyro{display:block}
    #rotate-full{background:#754c87;color:#fff5d3;border:1px solid #fff5d355;border-radius:4px;padding:14px 24px;min-height:48px}
    #rotate p{font-size:22px;margin:0}#rotate small{max-width:280px;color:#c4bfb2;line-height:1.6}
    #touch-ui{--control-inset:0px;display:none;position:fixed;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none}
    body.mobile[data-game=RUNNING]:not(.portrait) #touch-ui{display:block}
    .touch-button{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #fff5d388;color:#fff5d3;background:#182631b8;font-size:18px;touch-action:none}
    .touch-button.held{background:#e9ba50aa;color:#243440}
    .touch-action-icon{display:block;width:34px;height:34px;margin:auto;fill:currentColor;pointer-events:none;--accent:#f2d084}
    .touch-action-icon .accent{fill:var(--accent)}
    .touch-button.held .touch-action-icon{--accent:#754c87}
    #fire .touch-action-icon{width:50px;height:50px}
    #fire{width:92px;height:92px;right:calc(max(24px,env(safe-area-inset-right)) + var(--control-inset));bottom:calc(max(42px,env(safe-area-inset-bottom)) + var(--control-inset));font-size:22px}
    #interact{display:none;right:calc(134px + var(--control-inset));bottom:calc(114px + var(--control-inset));width:90px;border-radius:8px}body[data-mode=defuse] #interact{display:block}
    #jump{right:calc(max(134px,env(safe-area-inset-right) + 110px) + var(--control-inset));bottom:calc(28px + var(--control-inset))}
    #reload{right:calc(max(32px,env(safe-area-inset-right)) + var(--control-inset));bottom:calc(154px + var(--control-inset))}
    #aim{width:48px;height:48px;right:calc(max(110px,env(safe-area-inset-right) + 78px) + var(--control-inset));bottom:calc(max(167px,env(safe-area-inset-bottom) + 123px) + var(--control-inset))}
    #aim .touch-action-icon{width:30px;height:30px}
    #aim[aria-pressed=true]{background:#e9ba50;border-color:#f2d084;color:#17242f}
    #aim[aria-pressed=true] .accent{fill:currentColor}
    #grenade{display:grid;place-items:center;right:calc(max(134px,env(safe-area-inset-right) + 110px) + var(--control-inset));bottom:calc(max(102px,env(safe-area-inset-bottom) + 62px) + var(--control-inset))}
    body[data-mode=defuse] #grenade{display:none}
    #grenade img{width:30px;height:30px;pointer-events:none}
    #grenade[aria-disabled=true] img{opacity:.38}
    #pause{right:max(24px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;font-size:16px}
    #stick{position:absolute;left:calc(max(28px,env(safe-area-inset-left)) + var(--control-inset));bottom:calc(35px + var(--control-inset));width:120px;height:120px;border:2px solid #fff5d355;border-radius:50%;background:#24344030;pointer-events:none}
    #stick span{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#fff5d366}
    #title-tools{position:fixed;top:var(--title-top);right:var(--title-right);display:flex;gap:8px;z-index:7}
    #title-tools button{display:none;min-height:44px;padding:8px 14px;background:#173b30;color:#fff5d3;border:1px solid #fff5d366}
    body[data-game=TITLE]:not(.mobile.portrait) #loading[hidden]~#title-tools .comedy-toggle{display:grid;place-items:center;width:44px;padding:0}
    .comedy-toggle img{width:28px;height:28px;pointer-events:none}
    #title-tools #comedy-mode[aria-pressed=true]{background:#62412f;border:2px solid #f2d084}
    #title-tools #roach-mode[aria-pressed=true]{background:#533c65;border:2px solid #f2d084}
    body:not(.mobile.portrait):not(.fullscreen):is([data-game=TITLE],[data-game=PAUSED],[data-game=RESULTS]) #loading[hidden]~#title-tools #immersive{display:block}
    #immersive-note[hidden],body[data-game=RUNNING] #immersive-note,body[data-game=LOADING] #immersive-note{display:none}
    #immersive-note{position:fixed;z-index:21;left:10%;right:10%;bottom:12px;text-align:center;background:#243440e8;padding:12px;font-size:13px;color:#fff5d3}
    #toolbar-tip[hidden],#toolbar-tip:has(~#gyro-panel:not([hidden])){display:none}
    #toolbar-tip{position:fixed;z-index:8;top:calc(var(--visible-height,100dvh)*.42);left:50%;transform:translate(-50%,-50%);width:min(372px,54vw);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:#17242f;border:1px solid #f2d08478;border-radius:8px;box-shadow:0 6px 20px #0005}
    #toolbar-tip p{margin:0;font-size:13px;line-height:1.4}
    #toolbar-tip button{flex:none;min-height:44px;min-width:44px;padding:6px 10px;border:1px solid #fff5d32e;border-radius:5px;background:#39434b;color:#fff5d3}
    body.mobile:is([data-game=TITLE],[data-game=RESULTS]):not(.portrait) #loading[hidden]~#title-tools #gyro-open{display:block}
    #gyro-open .ui-icon{fill:currentColor;stroke:none;shape-rendering:crispEdges}
    #gyro-panel[hidden],body.mobile.portrait #gyro-panel{display:none}#gyro-panel{position:fixed;inset:0 0 auto;height:var(--visible-height,100dvh);z-index:22;background:#0f1721b8;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    #gyro-panel section{background:#17242f;border:1px solid #f2d08478;padding:20px 24px;width:min(420px,100%);max-height:100%;overflow:auto;border-radius:12px;box-shadow:0 12px 40px #0006}
    #gyro-panel[data-step=setup] section{display:flex;flex-direction:column}
    #gyro-panel[data-step=setup] :is(header,.gyro-actions){flex:none}
    #gyro-panel[data-step=setup] #gyro-status{min-height:0;overflow:auto}
    #gyro-panel[data-step=settings] section{width:min(520px,100%)}
    #gyro-panel header,.gyro-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #gyro-panel header{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #fff5d328}
    #gyro-panel h2{margin:0;font-size:22px}
    #gyro-title:focus{outline:none}
    .gyro-label{display:inline-flex;align-items:center;gap:9px}.gyro-label .ui-icon{color:#f2d084;flex:none}
    #gyro-panel button{min-height:44px;min-width:44px;border:1px solid #fff5d32e;background:#263645;color:#fff5d3;padding:8px 12px;border-radius:6px}
    #gyro-panel #gyro-close{padding:0}
    #gyro-panel #gyro-toggle{min-width:70px}
    #gyro-toggle[aria-checked=true]{background:#f2d084;color:#17242f}#gyro-panel button:disabled{opacity:.45;cursor:default}
    #gyro-panel [hidden]{display:none}
    #gyro-panel input{accent-color:#f2d084}#gyro-panel input[type=range]{display:block;width:100%;height:28px;margin:0;touch-action:pan-y}#gyro-panel input:focus-visible{outline:2px solid #e9ba50}
    #gyro-panel output{color:#f2d084;font-variant-numeric:tabular-nums}
    .gyro-setting-card{background:#1f2e3c;border-radius:8px;padding:8px 12px}.gyro-setting-card>.gyro-row:first-child{margin-bottom:7px}
    #gyro-status{font-size:14px;margin:0 0 12px;color:#c9c4b8;line-height:1.45}
    #gyro-status:empty{display:none}
    #gyro-panel .gyro-primary{background:#754c87;color:white}
    #gyro-panel .gyro-secondary{background:#39434b}
    .gyro-actions,.gyro-axis-list{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .gyro-actions[data-gyro-step=settings],.gyro-axis-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    #gyro-panel fieldset{margin:10px 0;padding:0;border:0;font-size:14px}#gyro-panel legend{padding:0 0 5px}
    .gyro-axis-list{grid-template-columns:repeat(3,minmax(0,1fr))}
    .gyro-axis-list label{min-height:44px;display:flex;justify-content:center;align-items:center;gap:5px;padding:0 8px;background:#1f2e3c;border:1px solid #fff5d32e;border-radius:6px}
    .gyro-axis-list label:has(input:checked){border-color:#f2d084;color:#f2d084}
    .gyro-axis-list input{width:16px;height:16px;margin:0}
    #gyro-panel[data-step=practice] section{width:min(550px,100%)}
    #gyro-room{display:block;width:100%;height:min(38vh,220px);background:#1c2b3e;border:2px solid #17202a}
    .gyro-calibration{position:relative;width:min(176px,46vh,100%);aspect-ratio:1;min-height:0;margin:10px auto 16px;--gyro-signal:#8796a4}
    .gyro-calibration[data-signal=steady]{--gyro-signal:#f2d084}
    .gyro-calibration[data-signal=shaky]{--gyro-signal:#ff9676}
    #gyro-gimbal{position:absolute;inset:0;display:block;width:100%;height:100%;color:var(--gyro-signal)}
    @media(max-height:400px){
      #gyro-panel section{padding:10px 20px}
      #gyro-panel header{margin-bottom:6px;padding-bottom:5px}
      #gyro-status{margin-bottom:8px}
      .gyro-setting-card{padding:6px 12px}.gyro-setting-card>.gyro-row:first-child{margin-bottom:5px}
      #gyro-panel fieldset{margin:7px 0}
    }
    @media(max-height:320px){.gyro-calibration{margin-block:4px 8px}}
    @media(prefers-reduced-motion:reduce){#loading,#loader-cartridges,#loader-fire{transition:none}}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="loading" aria-busy="true">
    <svg id="loader-scene" viewBox="0 0 1440 810" aria-label="No-Art-FPS" role="img" focusable="false">
      <defs>
        <path id="loader-round" d="M3 37V12L7 3l4 9v25z"/>
        <pattern id="rounds-empty" width="14" height="40" patternUnits="userSpaceOnUse"><use href="#loader-round" fill="#51365f"/></pattern>
        <pattern id="rounds-gold" width="14" height="40" patternUnits="userSpaceOnUse"><use href="#loader-round" fill="#f2d084"/><path d="M4 29h6v6H4z" fill="#fff8e8"/></pattern>
      </defs>
      <rect id="loader-sky" width="1440" height="810" fill="#5b7fc8"/>
      <image id="loader-background" href="title-background.webp" width="1440" height="810" preserveAspectRatio="xMidYMid slice"/>
      <rect id="loader-shade" width="1440" height="810" fill="black" opacity=".55"/>
      <g id="loader-title" font-size="160"><text x="58" y="220">NO</text><text x="58" y="370">ART</text><text x="58" y="520">FPS</text></g>
      <g id="loader-action" transform="translate(58 640)">
        <rect id="loader-button" width="300" height="112" fill="#754c87"/>
        <svg id="loader-cartridges" x="10" y="36" width="280" height="40" viewBox="0 0 280 40" preserveAspectRatio="none" aria-hidden="true">
          <rect width="280" height="40" fill="url(#rounds-empty)"/>
          <rect id="loaded-rounds" width="14" height="40" fill="url(#rounds-gold)"/>
        </svg>
        <text id="loader-fire" x="150" y="56" dominant-baseline="central" text-anchor="middle" font-size="68">FIRE</text>
      </g>
    </svg>
    <div class="loader-status">
      <progress id="progress" max="1" value="0" aria-label="游戏加载进度" data-i18n-aria-label></progress>
      <span id="phase" role="status" data-i18n>正在连接</span><span id="amount" aria-hidden="true"></span>
      <button id="retry" hidden data-i18n>重新加载</button>
    </div>
    <noscript class="loader-noscript">请启用 JavaScript 后再试玩。</noscript>
  </div>
  <script>
    const titleSelectionKey='no-art-fps.title.v1';
    const titleMapIds=new Set(['amusement_park','last_ferry','night_studio','sandgate','bb_office','snowline','hogwarts','palm_house','ginza_station']);
    const titleImageLimit=320000;
    const initialTitle=(()=>{
      try{
        const stored=JSON.parse(window.localStorage.getItem(titleSelectionKey));
        if(titleMapIds.has(stored?.id))return stored;
      }catch{}
      return {};
    })();
    window.noArtReadTitleSelection=()=>initialTitle.id||'';
    const cachedTitleImage=initialTitle.image;
    if(typeof cachedTitleImage==='string'&&cachedTitleImage.length<=titleImageLimit&&/^UklGR[A-Za-z0-9+/]+=*$/.test(cachedTitleImage)){
      const background=document.querySelector('#loader-background');
      background.addEventListener('error',()=>background.setAttribute('href','title-background.webp'),{once:true});
      background.setAttribute('href','data:image/webp;base64,'+cachedTitleImage);
    }
  </script>
  <canvas id="canvas" tabindex="0" aria-label="No-Art-FPS 游戏画面" data-i18n-aria-label></canvas>
  <div id="sky-edge" aria-hidden="true"></div><div id="title-safe-area" aria-hidden="true"></div>
  <div id="help" hidden><span class="desktop-controls" data-i18n>WASD 移动 · Shift 冲刺 · 右键开镜 · 左键开火 · G 投雷 · Esc 暂停</span><span class="mobile-warning" data-i18n>左侧移动 · 右侧瞄准</span></div>

  <div id="rotate"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="28" y="13" width="44" height="74" rx="7" transform="rotate(30 50 50)"/><path d="M8 48a42 42 0 0 1 70-30m0-12v12H65M92 52a42 42 0 0 1-70 30m0 12V82h13"/></svg><p class="rotate-game" data-i18n>横过来，准备开火</p><p class="rotate-gyro" data-i18n>请横握设备校准</p><small data-i18n>左手移动，右手瞄准</small><button id="rotate-full" data-i18n>横屏全屏</button></div>
  <div id="title-tools">
    <button id="gyro-open" aria-haspopup="dialog"><svg class="ui-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 1h6v2H5zM3 3h2v2H3zm8 0h2v2h-2zM1 5h2v6H1zm12 0h2v6h-2zM3 11h2v2H3zm8 0h2v2h-2zM5 13h6v2H5zM5 6h2V4h2v2h2v4H9v2H7v-2H5zm2 1v2h2V7z" fill-rule="evenodd"/></svg> <span data-i18n>体感</span></button>
    <button id="immersive" aria-label="进入沉浸全屏" data-i18n-aria-label><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg> <span data-i18n>全屏</span></button>
    <button id="comedy-mode" class="comedy-toggle" type="button" aria-label="大便模式" data-i18n-aria-label aria-pressed="false"><img src="comedy.svg" alt="" width="28" height="28"></button>
    <button id="roach-mode" class="comedy-toggle" type="button" aria-label="蟑螂模式" data-i18n-aria-label aria-pressed="false"><img src="roach.svg" alt="" width="28" height="28"></button>
  </div>
  <div id="immersive-note" role="status" hidden></div>
  <aside id="toolbar-tip" hidden>
    <p role="status" data-i18n>点按 Safari 地址栏左侧的页面菜单，选择「隐藏工具栏」。</p>
    <button id="toolbar-tip-ignore" type="button" data-i18n>忽略</button>
  </aside>
  <div id="touch-ui" aria-label="触控操作" data-i18n-aria-label>
    <div id="stick"><span></span></div>
    <button class="touch-button" id="fire" aria-label="按住开火" data-i18n-aria-label><svg class="touch-action-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M14.5 2h3v7h-3zM14.5 23h3v7h-3zM2 14.5h7v3H2zM23 14.5h7v3h-7zM5 13a11.4 11.4 0 0 1 8-8v2.7A9 9 0 0 0 7.7 13zm14-8a11.4 11.4 0 0 1 4.2 2l-2 1.7A9 9 0 0 0 19 7.7zm8 8h-2.7l-.8-1.9 1.6-2A11.4 11.4 0 0 1 27 13zM5 19h2.7a9 9 0 0 0 5.3 5.3V27a11.4 11.4 0 0 1-8-8zm22 0a11.4 11.4 0 0 1-8 8v-2.7a9 9 0 0 0 5.3-5.3z"/>
      <path class="accent" d="m27.5 4-6.2 11 3 2.7-5.5.7.9 5.2-3.8-3.4-4.5 4.3 1.6-5.7-6.1.8 5-3.9-2.2-4 4.6 1.6 1.6-5.4 1.4 5z"/>
    </svg></button>
    <button class="touch-button" id="jump" aria-label="跳跃" data-i18n-aria-label><svg class="touch-action-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M5 17c2.1 0 3.8-.3 5.3-1.1l-.8-1.6c-.5-.9-.1-2.1.7-2.6l2.7-1.5 2.3 2.6-1.4 2.1 1.5 1 1.5-2 1.4.8-1.2 2.1 1.5.8 1.2-2c3.2 1.2 7.3-2.6 9.6 2.3l-7 2.9-7.3 1L6 25l-1-8zm1.6 9.4 8.7-3.2 7.2-1 7.2-2.8c.3 2.2-1.9 3.8-5.1 4.8L16 26l-6.5 2.4c-1.5.5-2.3-.5-2.9-2zM2.6 27.5l4.1-2.7 1 1.5-4.1 2.7zm2 2.3 4.2-2.7 1 1.5-4.2 2.7z"/>
      <path class="accent" d="m26.2 2-2.3 7.8-1.5-2.2-5.3 3.5-1.7-2.6 5.3-3.4-1.5-2.2z"/>
    </svg></button>

  <script>
    window.noArtMobile=matchMedia('(pointer:coarse)').matches||new URLSearchParams(location.search).has('touch');
    const t=text=>window.noArtText?.(text)??text;
    const isLandscape=()=>innerWidth>=innerHeight;
    const toolbarTip=document.querySelector('#toolbar-tip');
    const toolbarTipKey='no-art-ignore-toolbar-tip';
    let toolbarTipIgnored=false;
    try{toolbarTipIgnored=window.sessionStorage.getItem(toolbarTipKey)==='1';}catch{}
    function isMobileSafari(){
      const browser=window.navigator;
      const agent=browser?.userAgent??'';
      const mobile=/iPhone|iPad|iPod|Mobile\//.test(agent)||(/Macintosh/.test(agent)&&browser.maxTouchPoints>1);
      return mobile&&/Version\/[\d.]+.*Safari\//.test(agent)&&!/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|GSA/.test(agent);
    }
    function syncToolbarTip(){
      const height=window.visualViewport?.height||innerHeight;
      toolbarTip.hidden=toolbarTipIgnored||document.hidden||document.body.dataset.game!=='TITLE'||
        !document.querySelector('#loading').hidden||innerWidth<=innerHeight||height>=320||
        isFullscreen()||window.navigator?.standalone||matchMedia('(display-mode: standalone)').matches||!isMobileSafari();
    }
    document.querySelector('#toolbar-tip-ignore').onclick=()=>{
      toolbarTipIgnored=true;
      toolbarTip.hidden=true;
      try{window.sessionStorage.setItem(toolbarTipKey,'1');}catch{}
    };
    window.visualViewport?.addEventListener('resize',syncToolbarTip);
    const touch={x:0,y:0,dx:0,dy:0,fire:false,aim:false,interact:false,jump:false,reload:false,grenade:false,pause:false,blocked:false};
    let pauseRequested=false,focused=true;
    let gyroSetup=null;
    function syncGyro(alive=true){
      const running=gyroSetup?.practicing||(alive&&document.body.dataset.game==='RUNNING'&&!pauseRequested);
      gyroSetup?.gyro.setContext({running,landscape:isLandscape(),visible:!document.hidden,focused});
    }
    const gyroStartup=window.noArtMobile
      ? Promise.all([import('./gyro.js'),import('./gyro-setup.js')]).then(([,module])=>{
          gyroSetup=module.setupGyroPanel({
            makeGyro:changed=>window.NoArtGyro.create({changed}),
            sync:syncGyro,
            isLandscape,
            isActive:()=>!document.hidden&&focused&&isLandscape()
          });
          syncGyro();
        }).catch(()=>{
          document.querySelector('#gyro-status').textContent=t('体感组件加载失败。请刷新页面后重试。');
        })
      : Promise.resolve();
    window.noArtOpenGyro=()=>{
      if(!window.noArtMobile||!['TITLE','PAUSED','RESULTS'].includes(document.body.dataset.game))return;
      if(gyroSetup)gyroSetup.openSettings();
      else{
        const panel=document.querySelector('#gyro-panel');
        panel.hidden=false;
        document.querySelector('#gyro-close').onclick=()=>{panel.hidden=true;};
      }
    };
    document.querySelector('#gyro-open').onclick=window.noArtOpenGyro;
    const comedyButtons={comedy:document.querySelector('#comedy-mode'),roach:document.querySelector('#roach-mode')};
    for(const [mode,button] of Object.entries(comedyButtons))button.onclick=()=>window.noArtToggleComedy?.(mode);
    window.noArtSetComedy=selected=>{
      for(const [mode,button] of Object.entries(comedyButtons))button.setAttribute('aria-pressed',String(mode===selected));
    };
    const progressKey='no-art-progress-v1';
    function readProgress(){
      try{
        const data=JSON.parse(window.localStorage.getItem(progressKey));
        return data&&typeof data==='object'&&!Array.isArray(data)?data:{};
      }catch{return {};}
    }
    window.noArtReadProgress=()=>JSON.stringify(readProgress());
    window.noArtWriteProgress=next=>{
      try{
        const saved=readProgress(),merged={};
        for(const group of ['achievements','scores']){
          const values=merged[group]=Object.create(null);
          for(const entries of [saved[group],next[group]]){
            if(!entries||typeof entries!=='object'||Array.isArray(entries))continue;
            for(const [key,value] of Object.entries(entries)){
              if(/^[a-z][a-z0-9_]*$/.test(key)&&Number.isSafeInteger(value)&&value>0){
                values[key]=Math.max(values[key]??0,value);
              }
            }
          }
        }
        const json=JSON.stringify(merged);
        window.localStorage.setItem(progressKey,json);
        return json;
      }catch{return '';}
    };
    const fingers=new Map(),ui=document.querySelector('#touch-ui'),knob=document.querySelector('#stick span');
    const stick=document.querySelector('#stick');
    const aimButton=document.querySelector('#aim');
    window.noArtSetAim=active=>aimButton.setAttribute('aria-pressed',String(active));
    aimButton.onclick=e=>{if(e.detail===0)touch.aim=true;};
    const grenadeButton=document.querySelector('#grenade'),grenadeIcon=document.querySelector('#grenade-icon');
    window.noArtSetGrenades=(count,mode)=>{
      const [name,src]=mode==='comedy'?['便便雷','stink-bomb.svg']:mode==='roach'?['蟑螂雷','roach-bomb.svg']:['碎片雷','frag-grenade.svg'];
      grenadeButton.dataset.stock=String(count);
      grenadeButton.setAttribute('aria-disabled',String(count===0));
      grenadeButton.setAttribute('aria-label',`${t(name)} · ${t('剩余 {count} 枚').replace('{count}',String(count))}`);
      if(grenadeIcon.getAttribute('src')!==src)grenadeIcon.setAttribute('src',src);
    };
    const controlInsetKey='no-art-control-inset';
    let savedControlInset=null;
    function boundedControlInset(value){return Math.max(0,Math.min(96,Math.round(value)));}
    try{
      const saved=window.localStorage.getItem(controlInsetKey);
      if(saved!==null&&/^\d+$/.test(saved))savedControlInset=boundedControlInset(Number(saved));
    }catch{}
    window.noArtHasControlInset=()=>window.noArtMobile&&innerWidth>=900&&innerHeight>=600&&innerWidth>=innerHeight;
    window.noArtGetControlInset=()=>window.noArtHasControlInset()?(savedControlInset??40):0;
    function syncTouchStick(){
      if(!window.noArtMobile||document.body.dataset.game!=='RUNNING'||!window.noArtTouchStickChanged)return;
      const bounds=stick.getBoundingClientRect();
      if(bounds.width>0)window.noArtTouchStickChanged(bounds.left/innerWidth,bounds.top/innerHeight,bounds.width/innerWidth,bounds.height/innerHeight);
    }
    function syncControlInset(){
      ui.style.setProperty('--control-inset',`${window.noArtGetControlInset()}px`);
      syncTouchStick();
    }
    window.noArtSetControlInset=value=>{
      if(!window.noArtHasControlInset()||!Number.isFinite(value))return;
      savedControlInset=boundedControlInset(value);
      syncControlInset();
      try{window.localStorage.setItem(controlInsetKey,String(savedControlInset));}catch{}
    };
    function clearTouch(){gyroSetup?.gyro.reset();fingers.clear();Object.assign(touch,{x:0,y:0,dx:0,dy:0,fire:false,aim:false,interact:false,jump:false,reload:false,grenade:false,pause:false});knob.style.transform='';document.querySelectorAll('.held').forEach(e=>e.classList.remove('held'));}
    function syncScreenLayout(){const portrait=!isLandscape();document.body.classList.toggle('portrait',portrait);touch.blocked=portrait||document.hidden;syncControlInset();if(portrait){clearTouch();pauseRequested=true;}syncGyro();syncToolbarTip();}
    document.body.classList.toggle('mobile',window.noArtMobile);syncScreenLayout();window.addEventListener('resize',()=>{clearTouch();syncScreenLayout();});window.addEventListener('orientationchange',()=>{clearTouch();syncScreenLayout();});screen.orientation?.addEventListener?.('change',()=>{clearTouch();syncScreenLayout();});
    document.addEventListener('visibilitychange',()=>{clearTouch();syncScreenLayout();if(document.hidden)pauseRequested=true;});window.addEventListener('blur',()=>{focused=false;clearTouch();if(document.body.dataset.game==='RUNNING')pauseRequested=true;syncGyro();});window.addEventListener('focus',()=>{focused=true;syncGyro();});
    window.noArtMode=mode=>{document.body.dataset.mode=mode;clearTouch();};
    window.noArtState=state=>{document.body.dataset.game=state;window.noArtUpdateSky?.();clearTouch();hideImmersiveNote();immersiveAttempt++;if(state!=='RUNNING')pauseRequested=false;if(state==='RUNNING'||state==='LOADING')gyroSetup?.close(false);syncGyro();syncToolbarTip();syncTouchStick();};
    window.noArtReadTouch=(alive=true)=>{
      syncGyro(alive);
      const motion=gyroSetup?.practicing?null:gyroSetup?.gyro.read();
      const result=JSON.stringify({...touch,...motion,pause:touch.pause||pauseRequested});
      pauseRequested=false;touch.dx=touch.dy=0;touch.aim=touch.jump=touch.reload=touch.grenade=touch.pause=false;
      return result;
    };
    ui.addEventListener('contextmenu',e=>e.preventDefault());
    // iOS Safari can zoom on positioned buttons despite touch-action: none.
    ui.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
    ui.addEventListener('pointerdown',e=>{e.preventDefault();const action=e.target.closest('button')?.id;if(action==='grenade'&&grenadeButton.dataset.stock==='0')return;ui.setPointerCapture(e.pointerId);const kind=action||(e.clientX<innerWidth*.4?'move':'look');if([...fingers.values()].some(f=>f.kind===kind))return;fingers.set(e.pointerId,{kind,x:e.clientX,y:e.clientY});if(action){touch[action]=true;document.getElementById(action).classList.add('held');}});
    ui.addEventListener('pointermove',e=>{const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(f.kind==='move'){const x=(e.clientX-f.x)/50,y=(e.clientY-f.y)/50,length=Math.max(1,Math.hypot(x,y));touch.x=x/length;touch.y=y/length;knob.style.transform=`translate(${touch.x*36}px,${touch.y*36}px)`;}else if(f.kind==='look'||f.kind==='fire'||f.kind==='aim'){touch.dx+=e.clientX-f.x;touch.dy+=e.clientY-f.y;f.x=e.clientX;f.y=e.clientY;}});
    function release(e){const f=fingers.get(e.pointerId);if(!f)return;fingers.delete(e.pointerId);if(f.kind==='move'){touch.x=touch.y=0;knob.style.transform='';}if(f.kind==='fire')touch.fire=false;if(f.kind==='interact')touch.interact=false;document.getElementById(f.kind)?.classList.remove('held');}
    for(const event of ['pointerup','pointercancel','lostpointercapture'])ui.addEventListener(event,release);
    const immersiveNote=document.querySelector('#immersive-note');
    let immersiveTimer=0,immersiveAttempt=0;
    function isFullscreen(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement);}
    let fullscreen=isFullscreen();
    function hideImmersiveNote(){clearTimeout(immersiveTimer);immersiveTimer=0;immersiveNote.hidden=true;}
    async function immersive(explain=false){
      hideImmersiveNote();const attempt=++immersiveAttempt;
      try{
        if(!isFullscreen()){
          const root=document.documentElement;
          if(root.requestFullscreen&&document.fullscreenEnabled!==false)await root.requestFullscreen({navigationUI:'hide'});
          else if(root.webkitRequestFullscreen&&document.webkitFullscreenEnabled!==false)await root.webkitRequestFullscreen();
          else throw Error('unsupported');
        }
        try{await screen.orientation?.lock('landscape');}catch{}
      }catch{
        // Automatic requests stay silent. Never let a late rejection cover play.
        if(!explain||!toolbarTip.hidden||attempt!==immersiveAttempt||['RUNNING','LOADING'].includes(document.body.dataset.game))return;
        immersiveNote.textContent=t(isMobileSafari()?'可在 Safari 页面菜单选择「隐藏工具栏」。':'此浏览器暂不支持全屏');
        immersiveNote.hidden=false;
        immersiveTimer=setTimeout(hideImmersiveNote,2400);
      }
    }
    document.querySelector('#immersive').onclick=()=>immersive(true);
    document.querySelector('#rotate-full').onclick=()=>immersive(true);
    let attempted=false;
    function tryImmersive(){
      if(!window.noArtMobile||attempted||window.navigator?.userActivation?.isActive===false)return;
      attempted=true;immersive();
    }
    // Touch grants user activation on release. Some engines grant it only at touchend.
    const gameCanvas=document.querySelector('#canvas');

    gameCanvas.addEventListener('pointerup',tryImmersive,{capture:true});
    gameCanvas.addEventListener('touchend',tryImmersive,{capture:true});
    function syncFullscreen(){
      const active=isFullscreen();
      if(active===fullscreen)return;
      fullscreen=active;
      document.body.classList.toggle('fullscreen',active);
      clearTouch();
      if(!active&&document.body.dataset.game==='RUNNING')pauseRequested=true;
      syncToolbarTip();
    }
    document.addEventListener('fullscreenchange',syncFullscreen);
    document.addEventListener('webkitfullscreenchange',syncFullscreen);
  </script>
  <script>
    const loading=document.querySelector('#loading'),phase=document.querySelector('#phase'),amount=document.querySelector('#amount'),progress=document.querySelector('#progress'),rounds=document.querySelector('#loaded-rounds'),retry=document.querySelector('#retry'),help=document.querySelector('#help');
    let ready=false,failed=false,downloaded=0;
    const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');
    const themeColor=document.querySelector('meta[name="theme-color"]');
    const isSkyColor=value=>typeof value==='string'&&/^#[\da-f]{6}$/i.test(value);
    let menuSky=isSkyColor(initialTitle.menuSky)?initialTitle.menuSky:'#29395a';
    let liveSky=isSkyColor(initialTitle.liveSky)?initialTitle.liveSky:'#5b7fc8',destroySky='';
    window.noArtUpdateSky=()=>{
      const tint=['RUNNING','CAPTURING','PAUSED','RESULTS'].includes(document.body.dataset.game)?(destroySky||liveSky):menuSky;
      document.documentElement.style.setProperty('--sky-tint',tint);
      themeColor.content=tint;
    };
    window.noArtSetSky=(menu,live)=>{menuSky=menu;liveSky=live;window.noArtUpdateSky();};
    window.noArtSetDestroySky=tint=>{destroySky=tint;window.noArtUpdateSky();};
    window.noArtRememberTitle=(id,image)=>{
      if(!titleMapIds.has(id))return;
      const selection={id,menuSky,liveSky};
      try{
        if(image&&image.length<=titleImageLimit){
          window.localStorage.setItem(titleSelectionKey,JSON.stringify({...selection,image}));
          return;
        }
      }catch{}
      try{window.localStorage.setItem(titleSelectionKey,JSON.stringify(selection));}catch{}
    };
    document.querySelector('#loader-sky').setAttribute('fill',liveSky);
    window.noArtUpdateSky();
    const safeArea=document.querySelector('#title-safe-area');
    function layoutLoader(){
      document.documentElement.style.setProperty('--visible-height',`${window.visualViewport?.height||innerHeight}px`);
      const mobile=window.noArtMobile;
      const scale=mobile?Math.min(innerWidth/960,innerHeight/540):Math.min(innerWidth/1440,innerHeight/810);
      const width=innerWidth/scale,height=innerHeight/scale;
      const safe=safeArea.getBoundingClientRect();
      const left=safe.left/scale,bottom=safe.bottom/scale;
      window.noArtTitleLayoutChanged?.(safe.left/innerWidth,(innerWidth-safe.right)/innerWidth,(innerHeight-safe.bottom)/innerHeight,safe.top/innerHeight,window.noArtHasControlInset());
      document.querySelector('#loader-scene').setAttribute('viewBox',`0 0 ${width} ${height}`);
      for(const id of ['loader-sky','loader-background','loader-shade']){
        const element=document.getElementById(id);
        element.setAttribute('width',width);element.setAttribute('height',height);
      }
      const title=document.querySelector('#loader-title');
      const top=safe.top/scale;
      const baseline=mobile?Math.max(116,top+90):Math.max(220,top+144);
      title.setAttribute('font-size',mobile?106:160);
      [...title.children].forEach((word,index)=>{
        word.setAttribute('x',left);
        word.setAttribute('y',baseline+index*(mobile?100:150));
      });
      const buttonWidth=mobile?260:300,buttonHeight=mobile?100:112;
      document.querySelector('#loader-action').setAttribute('transform',`translate(${left} ${bottom-buttonHeight})`);
      const button=document.querySelector('#loader-button');
      button.setAttribute('width',buttonWidth);button.setAttribute('height',buttonHeight);
      const cartridges=document.querySelector('#loader-cartridges');
      cartridges.setAttribute('width',buttonWidth-20);cartridges.setAttribute('y',(buttonHeight-40)/2);
      const fire=document.querySelector('#loader-fire');
      fire.setAttribute('x',buttonWidth/2);fire.setAttribute('y',buttonHeight/2);
    }
    window.noArtSyncTitleLayout=layoutLoader;
    layoutLoader();window.addEventListener('resize',layoutLoader);
    window.addEventListener('orientationchange',layoutLoader);
    window.visualViewport?.addEventListener('resize',layoutLoader);
    retry.addEventListener('click',()=>location.reload());
    function fail(message){if(failed)return;failed=true;loading.hidden=false;loading.classList.remove('leaving','loaded');loading.classList.add('error');loading.setAttribute('aria-busy','false');phase.textContent=message;amount.textContent='';progress.hidden=true;retry.hidden=false;}
    function updateDownload(fraction){
      downloaded=Math.max(downloaded,Math.min(1,fraction));
      const fractionReady=ready?1:downloaded*.85;
      progress.value=fractionReady;
      const count=Math.max(1,Math.floor(fractionReady*20));
      rounds.setAttribute('width',count*14);rounds.dataset.count=count;
      amount.textContent=`${Math.floor(fractionReady*100)}%`;
    }
    window.noArtReady=async()=>{
      if(ready||failed)return;
      ready=true;
      await Promise.all([gyroStartup,document.fonts.load('700 160px Rajdhani').catch(()=>{})]);
      if(failed)return;
      phase.textContent=t('准备就绪');updateDownload(1);
      loading.setAttribute('aria-busy','false');
      await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:120));
      if(failed)return;
      loading.classList.add('loaded');
      await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:160));
      if(failed)return;
      loading.classList.add('leaving');
      await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?0:180));
      if(failed)return;
      loading.hidden=true;
      help.hidden=Boolean(document.pointerLockElement);
      gyroSetup?.openEntry();
      syncToolbarTip();
    };
    document.addEventListener('pointerlockchange',()=>{help.hidden=Boolean(document.pointerLockElement)||!ready;});
    document.querySelector('#canvas').addEventListener('contextmenu',event=>event.preventDefault());
    window.addEventListener('unhandledrejection',event=>{if(!ready)fail(t('加载遇到问题，请重试'));});
    function launch(){
      const missing=Engine.getMissingFeatures({threads:false});
      if(missing.length){fail(t('此浏览器不支持运行游戏，请使用新版 Chrome 或 Firefox'));return;}
      const config=$GODOT_CONFIG;
      config.canvas=document.querySelector('#canvas');
      phase.textContent=t('正在下载资源');
      config.onProgress=(current,total)=>{
        if(failed||ready)return;
        if(current>0&&total>0){updateDownload(current/total);if(downloaded===1)phase.textContent=t('正在准备场景');}
        else if(current>0&&downloaded===0){amount.textContent=`${(current/1048576).toFixed(1)} MB`;}
      };
      config.onPrintError=(...args)=>{console.error(...args);if(!ready&&args.some(value=>String(value).includes('SCRIPT ERROR')))fail(t('场景初始化失败，请重试'));};
      config.onExit=()=>fail(t('游戏已退出'));
      const engine=new Engine(config);
      engine.startGame().then(()=>{if(!ready&&!failed){phase.textContent=t('正在准备场景');updateDownload(1);}}).catch(error=>{console.error(error);fail(t('游戏加载失败，请检查网络后重试'));});
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const script=document.createElement('script');script.src='$GODOT_URL';script.onload=launch;script.onerror=()=>fail(t('游戏加载失败，请检查网络后重试'));document.body.appendChild(script);
    }));
  </script>
</body>
</html>
