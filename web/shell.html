<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#243440">
  <meta name="description" content="No-Art-FPS — 60 秒击杀冲刺。pixelcao 的明亮低多边形 FPS 小品。">
  <title>No-Art-FPS · pixelcao</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#243440;color:#fff5d3;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e9ba50;outline-offset:5px}
    #canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-items:center;padding:32px 24px;background:#243440;z-index:5;transition:opacity .2s}
    #loading[hidden]{display:none}#loading.leaving{opacity:0;pointer-events:none}
    .card{width:min(400px,100%)}h1{margin:0 0 36px;font-size:clamp(48px,10vw,76px);line-height:.88;letter-spacing:-.045em;font-weight:900}
    h1 span{display:block}.accent{color:#e9ba50}.progress-label{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin-bottom:12px;line-height:1.5}
    progress{display:block;width:100%;height:8px;border:0;background:#3e4f59;accent-color:#e9ba50}progress::-webkit-progress-bar{background:#3e4f59}progress::-webkit-progress-value{background:#e9ba50}progress::-moz-progress-bar{background:#e9ba50}
    .controls{margin:24px 0 0;color:#c4bfb2;font-size:13px;line-height:1.8}.actions{display:flex;gap:24px;align-items:center;margin-top:28px}.actions a{color:#e5e0d2;text-decoration:none;font-size:13px}
    #retry{border:0;background:#754c87;color:white;padding:12px 24px}#retry[hidden]{display:none}
    #help{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));color:#fff5d3;background:#243440ce;border:1px solid #fff5d340;padding:8px 12px;font-size:12px;z-index:2;max-width:calc(100% - 32px);text-align:center}
    #help[hidden]{display:none}.mobile-warning{display:none}@media(pointer:coarse){.desktop-controls{display:none}.mobile-warning{display:inline}}
    @media(prefers-reduced-motion:reduce){#loading{transition:none}}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="No-Art-FPS 游戏画面"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <h1><span>NO</span><span>ART</span><span class="accent">FPS</span></h1>
      <div class="progress-label"><span id="phase">正在加载游戏</span><span id="amount"></span></div>
      <progress id="progress" aria-label="游戏资源下载进度"></progress>
      <p class="controls"><span class="desktop-controls">WASD 移动 · 鼠标瞄准 · 左键开火<br>空格跳跃 · R 换弹 · Esc 暂停</span><span class="mobile-warning">请使用电脑键盘和鼠标试玩。<br>当前版本暂不支持触屏操作。</span></p>
      <div class="actions"><button id="retry" hidden>重新加载</button><a href="https://cv.yicong.me" rel="noopener">pixelcao ↗</a></div>
    </div>
  </div>
  <div id="help" hidden><span class="desktop-controls">WASD 移动 · 鼠标瞄准 · 左键开火 · Esc 暂停</span><span class="mobile-warning">请使用电脑键盘和鼠标试玩</span></div>
  <noscript>请启用 JavaScript 后再试玩 No-Art-FPS。</noscript>
  <script>
    const loading=document.querySelector('#loading'),phase=document.querySelector('#phase'),amount=document.querySelector('#amount'),progress=document.querySelector('#progress'),retry=document.querySelector('#retry'),help=document.querySelector('#help');
    let ready=false,failed=false;
    retry.addEventListener('click',()=>location.reload());
    function fail(message){if(failed)return;failed=true;loading.hidden=false;loading.classList.remove('leaving');phase.textContent=message;amount.textContent='';progress.hidden=true;retry.hidden=false;}
    window.noArtReady=()=>{if(ready||failed)return;ready=true;phase.textContent='准备就绪';progress.value=1;progress.max=1;amount.textContent='';loading.classList.add('leaving');setTimeout(()=>{loading.hidden=true;help.hidden=false;},200);};
    document.addEventListener('pointerlockchange',()=>{help.hidden=Boolean(document.pointerLockElement)||!ready;});
    document.querySelector('#canvas').addEventListener('contextmenu',event=>event.preventDefault());
    window.addEventListener('unhandledrejection',event=>{if(!ready)fail('加载遇到问题，请重试');});
    function launch(){
      const missing=Engine.getMissingFeatures({threads:false});
      if(missing.length){fail('此浏览器不支持运行游戏，请使用新版 Chrome 或 Firefox');return;}
      const config=$GODOT_CONFIG;
      config.canvas=document.querySelector('#canvas');
      config.onProgress=(current,total)=>{
        if(failed||ready)return;
        if(current>0&&total>0){progress.max=total;progress.value=current;amount.textContent=`${Math.min(100,Math.floor(current/total*100))}%`;phase.textContent=current>=total?'正在准备场景':'正在加载游戏';}
        else{progress.removeAttribute('value');amount.textContent=current>0?`${(current/1048576).toFixed(1)} MB`:'';}
      };
      config.onPrintError=(...args)=>{console.error(...args);if(!ready&&args.some(value=>String(value).includes('SCRIPT ERROR')))fail('场景初始化失败，请重试');};
      config.onExit=()=>fail('游戏已退出');
      const engine=new Engine(config);
      engine.startGame().then(()=>{if(!ready&&!failed){phase.textContent='正在准备场景';progress.removeAttribute('value');amount.textContent='';}}).catch(error=>{console.error(error);fail('游戏加载失败，请检查网络后重试');});
    }
    const script=document.createElement('script');script.src='$GODOT_URL';script.onload=launch;script.onerror=()=>fail('游戏加载失败，请检查网络后重试');document.body.appendChild(script);
  </script>
</body>
</html>
