<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#243440">
  <meta name="description" content="No-Art-FPS — 60 秒击杀冲刺。pixelcao 的明亮低多边形 FPS 小品。">
  <title>No-Art-FPS · pixelcao</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#243440;color:#fff5d3;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e9ba50;outline-offset:5px}
    .ui-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;pointer-events:none}.touch-button .ui-icon{width:26px;height:26px}
    #canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;align-items:center;padding:max(24px,env(safe-area-inset-top)) max(6vw,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(6vw,env(safe-area-inset-left));background:#6287cc;isolation:isolate;z-index:5;transition:opacity .2s}
    #loading[hidden]{display:none}#loading.leaving{opacity:0;pointer-events:none}
    .loader-yard{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
    .loader-card{width:min(400px,100%);color:white}
    .loader-title{margin:0 0 25px;font:900 clamp(68px,10vw,144px)/.8 Arial,sans-serif;letter-spacing:-.08em;text-shadow:4px 5px #243440}
    .loader-title span{display:block}.loader-title span:last-child{color:#ffe19a}
    .loader-panel{padding:12px 14px 10px;background:#26364e;border:3px solid #151e2a;box-shadow:5px 5px #151e2a;border-radius:3px}
    .loader-rail{display:block;width:100%;height:clamp(25px,4.5vw,37px);background:#182433;border:2px solid #0f1822}
    .loader-status{display:flex;align-items:baseline;justify-content:space-between;gap:14px;min-height:1.5em;margin:8px 0 0;font-size:13px;font-weight:700}
    #amount{color:#ffe19a;font-variant-numeric:tabular-nums}
    #progress{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
    #retry{margin-top:10px;border:2px solid #151e2a;background:#754c87;color:white;padding:8px 16px}#retry[hidden]{display:none}
    #help{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));color:#fff5d3;background:#243440ce;border:1px solid #fff5d340;padding:8px 12px;font-size:12px;z-index:2;max-width:calc(100% - 32px);text-align:center}
    #help[hidden]{display:none}.mobile-warning{display:none}@media(pointer:coarse){.desktop-controls{display:none}.mobile-warning{display:inline}}

    body.mobile .desktop-controls{display:none}body.mobile .mobile-warning{display:inline}
    body{height:100dvh;overscroll-behavior:none}body.mobile #help{display:none}
    #rotate{position:fixed;inset:0;z-index:20;background:#243440;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;gap:18px;flex-direction:column}
    body.mobile.portrait #loading[hidden]~#rotate{display:flex}#rotate svg{width:100px;height:100px;stroke:#e9ba50;fill:none;stroke-width:3}
    #rotate-full{background:#754c87;color:#fff5d3;border:1px solid #fff5d355;border-radius:4px;padding:14px 24px;min-height:48px}
    #rotate p{font-size:22px;margin:0}#rotate small{max-width:280px;color:#c4bfb2;line-height:1.6}
    #touch-ui{display:none;position:fixed;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none}
    body.mobile[data-game=RUNNING]:not(.portrait) #touch-ui{display:block}
    .touch-button{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #fff5d388;color:#fff5d3;background:#24344080;font-size:18px;touch-action:none}
    .touch-button.held{background:#e9ba50aa;color:#243440}
    #fire{width:92px;height:92px;right:max(24px,env(safe-area-inset-right));bottom:max(42px,env(safe-area-inset-bottom));font-size:22px}
    #interact{display:none;right:134px;bottom:114px;width:90px;border-radius:8px}body[data-mode=defuse] #interact{display:block}
    #jump{right:max(134px,calc(env(safe-area-inset-right) + 110px));bottom:28px}#reload{right:max(32px,env(safe-area-inset-right));bottom:154px}
    #pause{right:max(24px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;font-size:16px}
    #stick{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:35px;width:120px;height:120px;border:2px solid #fff5d355;border-radius:50%;background:#24344030;pointer-events:none}
    #stick span{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#fff5d366}
    #immersive{display:none;position:fixed;z-index:7;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));background:#243440bd;color:#fff5d3;border:1px solid #fff5d366;padding:10px 14px}
    body.mobile:not([data-game=RUNNING]):not(.portrait) #loading[hidden]~#immersive{display:block}
    #immersive-note[hidden],body[data-game=RUNNING] #immersive-note,body[data-game=LOADING] #immersive-note{display:none}
    #immersive-note{position:fixed;z-index:21;left:10%;right:10%;bottom:12px;text-align:center;background:#243440e8;padding:12px;font-size:13px;color:#fff5d3}
    @media(max-height:560px){.loader-title{font-size:clamp(50px,11vh,86px);margin-bottom:16px}}
    @media(max-height:400px) and (orientation:landscape){.loader-title{display:flex;gap:.17em;flex-wrap:wrap}}
    #gyro-open{display:none;position:fixed;z-index:7;top:max(10px,env(safe-area-inset-top));right:max(110px,calc(env(safe-area-inset-right) + 98px));min-height:44px;padding:10px 14px;background:#243440bd;color:#fff5d3;border:1px solid #fff5d366}
    body.mobile:is([data-game=TITLE],[data-game=RESULTS]):not(.portrait) #loading[hidden]~#gyro-open{display:block}
    #gyro-panel[hidden]{display:none}#gyro-panel{position:fixed;inset:0;z-index:18;background:#13202bd9;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    #gyro-panel section{background:#243440;border:1px solid #fff5d355;padding:20px 24px;width:min(380px,100%);max-height:100%;overflow:auto;border-radius:8px}
    #gyro-panel header,.gyro-row{display:flex;align-items:center;justify-content:space-between;gap:16px}#gyro-panel h2{margin:0;font-size:22px}#gyro-panel header{margin-bottom:16px}
    #gyro-panel button{min-height:44px;min-width:44px;border:1px solid #fff5d366;background:#344650;color:#fff5d3;padding:8px 12px;border-radius:4px}#gyro-toggle[aria-checked=true]{background:#e9ba50;color:#243440}#gyro-panel button:disabled{opacity:.45;cursor:default}
    #gyro-panel input{width:100%;height:44px;accent-color:#e9ba50;touch-action:pan-y}#gyro-panel input:focus-visible{outline:2px solid #e9ba50}#gyro-panel output{font-variant-numeric:tabular-nums}.gyro-row{margin-bottom:8px}#gyro-status{font-size:14px;min-height:3em;margin:0 0 12px;color:#fff5d3;line-height:1.5}
    @media(max-height:400px){#gyro-panel section{padding:12px 20px}#gyro-panel header{margin-bottom:8px}}
    @media(prefers-reduced-motion:reduce){#loading{transition:none}}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="loading">
    <svg class="loader-yard" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="yard-shade"><stop stop-color="#233450" stop-opacity=".55"/><stop offset=".68" stop-color="#233450" stop-opacity="0"/></linearGradient>
        <pattern id="yard-ribs" width="32" height="104" patternUnits="userSpaceOnUse"><path d="M8 0v104m5-104v104" stroke="#151e2a" stroke-opacity=".29" stroke-width="3"/></pattern>
      </defs>
      <path fill="#6287cc" d="M0 0h1440v810H0z"/>
      <path fill="#eee8d8" stroke="#243440" stroke-width="4" d="m615 162 39-16 29-2 23-12 49 9 16 13-12 15-115 7zm505-82 33-19 54-3 42 17 13 18-43 9-75-2z"/>
      <path fill="#e8c477" d="M0 470h1440v340H0z"/>
      <path fill="#717e8b" stroke="#263440" stroke-width="4" d="M616 483h144l590 327H452z"/>
      <path fill="#fff0bd" d="m712 519 8 2 33 27-13-2zm59 52 18 5 53 43-25-3zm95 80 31 9 102 85-44-4z"/>
      <g stroke="#263440" stroke-width="5" stroke-linejoin="round">
        <path fill="#3f6d63" d="m627 404 72-40 157 20 3 92-232-4z"/>
        <path fill="#629687" d="m627 404 70-40 3 104-73 4z"/>

        <path fill="#654788" d="m946 288 115-62 314 30v171l-429-14z"/>

        <path fill="url(#yard-ribs)" d="m1061 226 314 30v171l-314-26z"/>
        <path fill="#e6ded0" d="m1171 290 204 21v116l-204-12z"/>
        <path fill="#394c61" d="m1270 310 4 108m-69-84 41 3m51 5 42 3" fill-opacity="0"/>
        <path fill="#c45b48" d="m971 576 44 2 6 64-15 14-33-2-12-15z"/>
        <path fill="#e6ba62" d="m967 596 51 2 1 12-53-2z"/>
        <path fill="#e9a167" d="m971 576 13-8 26 2 5 8-13 10-23-1z"/>
      </g>
      <path fill="url(#yard-shade)" d="M0 0h1440v810H0z"/>
    </svg>
    <div class="loader-card">
      <h1 class="loader-title" aria-label="No-Art-FPS"><span>NO</span><span>ART</span><span>FPS</span></h1>
      <div class="loader-panel">
        <svg class="loader-rail" viewBox="0 0 400 38" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <defs>
            <path id="loader-round" d="M5 32V13l5-7 5 7v19z"/>
            <pattern id="rounds-empty" width="20" height="38" patternUnits="userSpaceOnUse"><use href="#loader-round" fill="#3b4c61"/></pattern>
            <pattern id="rounds-gold" width="20" height="38" patternUnits="userSpaceOnUse"><use href="#loader-round" fill="#f4c45c"/><path d="M6 25h8v6H6z" fill="#ffe19a"/></pattern>
          </defs>
          <rect width="400" height="38" fill="url(#rounds-empty)"/>
          <rect id="loaded-rounds" width="20" height="38" fill="url(#rounds-gold)"/>
        </svg>
        <progress id="progress" max="1" value="0" aria-label="游戏资源下载进度"></progress>
        <div class="loader-status"><span id="phase" role="status">正在连接</span><span id="amount" aria-hidden="true"></span></div>
        <button id="retry" hidden>重新加载</button>
        <noscript>请启用 JavaScript 后再试玩。</noscript>
      </div>
    </div>
  </div>
  <canvas id="canvas" tabindex="0" aria-label="No-Art-FPS 游戏画面"></canvas>
  <div id="help" hidden><span class="desktop-controls">WASD 移动 · 鼠标瞄准 · 左键开火 · Esc 暂停</span><span class="mobile-warning">左侧移动 · 右侧瞄准</span></div>

  <div id="rotate"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="28" y="13" width="44" height="74" rx="7" transform="rotate(30 50 50)"/><path d="M8 48a42 42 0 0 1 70-30m0-12v12H65M92 52a42 42 0 0 1-70 30m0 12V82h13"/></svg><p>横过来，准备开火</p><small>左手移动，右手瞄准</small><button id="rotate-full">横屏全屏</button></div>
  <button id="immersive" aria-label="进入沉浸全屏"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg> 全屏</button><div id="immersive-note" role="status" hidden></div>
  <div id="touch-ui" aria-label="触控操作"><div id="stick"><span></span></div><button class="touch-button" id="fire" aria-label="按住开火"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button><button class="touch-button" id="jump" aria-label="跳跃"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 10 6-6 6 6M12 4v14M6 21h12"/></svg></button><button class="touch-button" id="reload" aria-label="换弹"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 7a8 8 0 1 0 1 8M19 3v5h-5"/></svg></button><button class="touch-button" id="interact" aria-label="按住拆除 C4">拆除</button><button class="touch-button" id="pause" aria-label="暂停"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg></button></div>
  <button id="gyro-open" aria-haspopup="dialog">体感瞄准</button>
  <div id="gyro-panel" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="gyro-title" tabindex="-1">
      <header><h2 id="gyro-title">体感瞄准</h2><button id="gyro-close" aria-label="关闭体感设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div class="gyro-row"><label for="gyro-toggle">运动传感器</label><button id="gyro-toggle" role="switch" aria-checked="false" aria-describedby="gyro-status" disabled>启用</button></div>
      <p id="gyro-status" role="status">正在检查浏览器支持</p>
      <label class="gyro-row" for="gyro-sensitivity">灵敏度 <output id="gyro-value" for="gyro-sensitivity">1.00x</output></label>
      <input id="gyro-sensitivity" type="range" min="0.25" max="3" step="0.25" value="1" aria-label="体感灵敏度">
      <button id="gyro-calibrate" disabled>重新校准</button>
    </section>
  </div>
  <script>
    window.noArtMobile=matchMedia('(pointer:coarse)').matches||new URLSearchParams(location.search).has('touch');
    const touch={x:0,y:0,dx:0,dy:0,fire:false,interact:false,jump:false,reload:false,pause:false,blocked:false};
    let pauseRequested=false,focused=true;
    const gyroPanel=document.querySelector('#gyro-panel'),gyroOpen=document.querySelector('#gyro-open'),gyroToggle=document.querySelector('#gyro-toggle'),gyroSlider=document.querySelector('#gyro-sensitivity'),gyroCalibrate=document.querySelector('#gyro-calibrate');
    let gyro=null,gyroLoadStatus='正在检查浏览器支持';
    function gyroChanged(s){
      gyroToggle.textContent=s?.pending?'取消':s?.enabled?'关闭':'启用';
      gyroToggle.disabled=!s?.available;gyroToggle.setAttribute('aria-checked',String(Boolean(s?.enabled)));
      const sensitivity=s?.sensitivity??1;
      gyroSlider.disabled=!s?.available;gyroSlider.value=String(sensitivity);document.querySelector('#gyro-value').textContent=sensitivity.toFixed(2)+'x';
      gyroCalibrate.disabled=!s?.enabled||s.calibrating;document.querySelector('#gyro-status').textContent=s?.status??gyroLoadStatus;
    }
    function closeGyro(restore=true){const wasOpen=!gyroPanel.hidden;gyroPanel.hidden=true;if(wasOpen&&restore)(gyroOpen.offsetWidth?gyroOpen:document.querySelector('#canvas')).focus({preventScroll:true});}
    function syncGyro(alive=true){gyro?.setContext({running:alive&&document.body.dataset.game==='RUNNING'&&!pauseRequested,landscape:innerWidth>=innerHeight,visible:!document.hidden,focused});}
    if(window.noArtMobile){
      const gyroScript=document.createElement('script');
      gyroScript.onload=()=>{gyro=window.NoArtGyro.create({changed:gyroChanged});gyroChanged(gyro.snapshot());syncGyro();};
      gyroScript.onerror=()=>{gyroLoadStatus='体感组件加载失败。请刷新页面后重试。';gyroChanged();};
      gyroScript.src='gyro.js';document.head.appendChild(gyroScript);
    }
    window.noArtOpenGyro=()=>{if(!window.noArtMobile||!['TITLE','PAUSED','RESULTS'].includes(document.body.dataset.game))return;gyroPanel.hidden=false;gyroChanged(gyro?.snapshot());document.querySelector('#gyro-close').focus();};
    gyroOpen.onclick=window.noArtOpenGyro;
    document.querySelector('#gyro-close').onclick=()=>closeGyro();
    gyroPanel.addEventListener('click',e=>{if(e.target===gyroPanel)closeGyro();});
    gyroPanel.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeGyro();}if(e.key==='Tab'){const items=[...gyroPanel.querySelectorAll('button:not(:disabled),input:not(:disabled)')],index=items.indexOf(document.activeElement);e.preventDefault();items[(index+(e.shiftKey?-1:1)+items.length)%items.length].focus();}});
    gyroToggle.onclick=()=>{const s=gyro?.snapshot();if(!s?.available)return;if(s.enabled||s.pending)gyro.disable();else gyro.enable();};
    gyroSlider.addEventListener('input',()=>gyro?.setSensitivity(gyroSlider.value));
    gyroCalibrate.onclick=()=>gyro?.calibrate();
    const fingers=new Map(),ui=document.querySelector('#touch-ui'),knob=document.querySelector('#stick span');
    function clearTouch(){gyro?.reset();fingers.clear();Object.assign(touch,{x:0,y:0,dx:0,dy:0,fire:false,interact:false,jump:false,reload:false,pause:false});knob.style.transform='';document.querySelectorAll('.held').forEach(e=>e.classList.remove('held'));}
    function orientation(){const portrait=innerHeight>innerWidth;document.body.classList.toggle('portrait',portrait);touch.blocked=portrait||document.hidden;if(portrait){clearTouch();closeGyro(false);pauseRequested=true;}syncGyro();}
    document.body.classList.toggle('mobile',window.noArtMobile);orientation();window.addEventListener('resize',()=>{clearTouch();orientation();});window.addEventListener('orientationchange',()=>{clearTouch();orientation();});screen.orientation?.addEventListener?.('change',()=>{clearTouch();orientation();});
    document.addEventListener('visibilitychange',()=>{clearTouch();orientation();if(document.hidden)pauseRequested=true;});window.addEventListener('blur',()=>{focused=false;clearTouch();if(document.body.dataset.game==='RUNNING')pauseRequested=true;syncGyro();});window.addEventListener('focus',()=>{focused=true;syncGyro();});
    window.noArtMode=mode=>{document.body.dataset.mode=mode;clearTouch();};
    window.noArtState=state=>{document.body.dataset.game=state;clearTouch();hideImmersiveNote();immersiveAttempt++;if(state!=='RUNNING')pauseRequested=false;if(state==='RUNNING'||state==='LOADING')closeGyro(false);syncGyro();};
    window.noArtReadTouch=(alive=true)=>{syncGyro(alive);const result=JSON.stringify({...touch,...gyro?.read(),pause:touch.pause||pauseRequested});pauseRequested=false;touch.dx=touch.dy=0;touch.jump=touch.reload=touch.pause=false;return result;};
    ui.addEventListener('contextmenu',e=>e.preventDefault());
    ui.addEventListener('pointerdown',e=>{e.preventDefault();ui.setPointerCapture(e.pointerId);const action=e.target.closest('button')?.id;const kind=action||(e.clientX<innerWidth*.4?'move':'look');if([...fingers.values()].some(f=>f.kind===kind))return;fingers.set(e.pointerId,{kind,x:e.clientX,y:e.clientY});if(action){touch[action]=true;document.getElementById(action).classList.add('held');}});
    ui.addEventListener('pointermove',e=>{const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(f.kind==='move'){const x=(e.clientX-f.x)/50,y=(e.clientY-f.y)/50,length=Math.max(1,Math.hypot(x,y));touch.x=x/length;touch.y=y/length;knob.style.transform=`translate(${touch.x*36}px,${touch.y*36}px)`;}else if(f.kind==='look'||f.kind==='fire'){touch.dx+=e.clientX-f.x;touch.dy+=e.clientY-f.y;f.x=e.clientX;f.y=e.clientY;}});
    function release(e){const f=fingers.get(e.pointerId);if(!f)return;fingers.delete(e.pointerId);if(f.kind==='move'){touch.x=touch.y=0;knob.style.transform='';}if(f.kind==='fire')touch.fire=false;if(f.kind==='interact')touch.interact=false;document.getElementById(f.kind)?.classList.remove('held');}
    for(const event of ['pointerup','pointercancel','lostpointercapture'])ui.addEventListener(event,release);
    const immersiveNote=document.querySelector('#immersive-note');
    let immersiveTimer=0,immersiveAttempt=0;
    function hideImmersiveNote(){clearTimeout(immersiveTimer);immersiveTimer=0;immersiveNote.hidden=true;}
    async function immersive(explain=false){
      hideImmersiveNote();const attempt=++immersiveAttempt;
      try{
        if(!document.fullscreenElement&&!document.webkitFullscreenElement){
          const method=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
          if(!method)throw Error('unsupported');
          await method.call(document.documentElement);
        }
        try{await screen.orientation?.lock('landscape');}catch{}
      }catch{
        // Automatic requests stay silent. Never let a late rejection cover play.
        if(!explain||attempt!==immersiveAttempt||['RUNNING','LOADING'].includes(document.body.dataset.game))return;
        immersiveNote.textContent='此浏览器暂不支持全屏';immersiveNote.hidden=false;
        immersiveTimer=setTimeout(hideImmersiveNote,2400);
      }
    }
    document.querySelector('#immersive').onclick=()=>immersive(true);
    document.querySelector('#rotate-full').onclick=()=>immersive(true);
    let attempted=false;document.querySelector('#canvas').addEventListener('pointerdown',()=>{if(window.noArtMobile&&!attempted){attempted=true;immersive();}},{capture:true});
    document.addEventListener('fullscreenchange',()=>{clearTouch();if(!document.fullscreenElement&&document.body.dataset.game==='RUNNING')pauseRequested=true;});
  </script>
  <script>
    const loading=document.querySelector('#loading'),phase=document.querySelector('#phase'),amount=document.querySelector('#amount'),progress=document.querySelector('#progress'),rounds=document.querySelector('#loaded-rounds'),retry=document.querySelector('#retry'),help=document.querySelector('#help');
    let ready=false,failed=false,downloaded=0;
    retry.addEventListener('click',()=>location.reload());
    function fail(message){if(failed)return;failed=true;loading.hidden=false;loading.classList.remove('leaving');phase.textContent=message;amount.textContent='';progress.hidden=true;retry.hidden=false;}
    function updateDownload(fraction){downloaded=Math.max(downloaded,Math.min(1,fraction));progress.value=downloaded;rounds.setAttribute('width',20+380*downloaded);amount.textContent=`${Math.floor(downloaded*100)}%`;}
    window.noArtReady=()=>{if(ready||failed)return;ready=true;phase.textContent='准备就绪';updateDownload(1);loading.classList.add('leaving');setTimeout(()=>{loading.hidden=true;help.hidden=Boolean(document.pointerLockElement);},200);};
    document.addEventListener('pointerlockchange',()=>{help.hidden=Boolean(document.pointerLockElement)||!ready;});
    document.querySelector('#canvas').addEventListener('contextmenu',event=>event.preventDefault());
    window.addEventListener('unhandledrejection',event=>{if(!ready)fail('加载遇到问题，请重试');});
    function launch(){
      const missing=Engine.getMissingFeatures({threads:false});
      if(missing.length){fail('此浏览器不支持运行游戏，请使用新版 Chrome 或 Firefox');return;}
      const config=$GODOT_CONFIG;
      config.canvas=document.querySelector('#canvas');
      phase.textContent='正在下载资源';
      config.onProgress=(current,total)=>{
        if(failed||ready)return;
        if(current>0&&total>0){updateDownload(current/total);if(downloaded===1)phase.textContent='正在准备场景';}
        else if(current>0&&downloaded===0){amount.textContent=`${(current/1048576).toFixed(1)} MB`;}
      };
      config.onPrintError=(...args)=>{console.error(...args);if(!ready&&args.some(value=>String(value).includes('SCRIPT ERROR')))fail('场景初始化失败，请重试');};
      config.onExit=()=>fail('游戏已退出');
      const engine=new Engine(config);
      engine.startGame().then(()=>{if(!ready&&!failed){phase.textContent='正在准备场景';updateDownload(1);}}).catch(error=>{console.error(error);fail('游戏加载失败，请检查网络后重试');});
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const script=document.createElement('script');script.src='$GODOT_URL';script.onload=launch;script.onerror=()=>fail('游戏加载失败，请检查网络后重试');document.body.appendChild(script);
    }));
  </script>
</body>
</html>
