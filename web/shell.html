<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#243440">
  <meta name="description" content="No-Art-FPS — 60 秒击杀冲刺。pixelcao 的明亮低多边形 FPS 小品。">
  <title>No-Art-FPS · pixelcao</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#243440;color:#fff5d3;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}
    button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e9ba50;outline-offset:5px}
    #canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-items:center;padding:32px 24px;background:#243440;z-index:5;transition:opacity .2s}
    #loading[hidden]{display:none}#loading.leaving{opacity:0;pointer-events:none}
    .card{width:min(400px,100%)}h1{margin:0 0 36px;font-size:clamp(48px,10vw,76px);line-height:.88;letter-spacing:-.045em;font-weight:900}
    h1 span{display:block}.accent{color:#e9ba50}.progress-label{display:flex;justify-content:space-between;gap:20px;font-size:14px;margin-bottom:12px;line-height:1.5}
    progress{display:block;width:100%;height:8px;border:0;background:#3e4f59;accent-color:#e9ba50}progress::-webkit-progress-bar{background:#3e4f59}progress::-webkit-progress-value{background:#e9ba50}progress::-moz-progress-bar{background:#e9ba50}
    .controls{margin:24px 0 0;color:#c4bfb2;font-size:13px;line-height:1.8}.actions{display:flex;gap:24px;align-items:center;margin-top:28px}.actions a{color:#e5e0d2;text-decoration:none;font-size:13px}
    #retry{border:0;background:#754c87;color:white;padding:12px 24px}#retry[hidden]{display:none}
    #help{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));color:#fff5d3;background:#243440ce;border:1px solid #fff5d340;padding:8px 12px;font-size:12px;z-index:2;max-width:calc(100% - 32px);text-align:center}
    #help[hidden]{display:none}.mobile-warning{display:none}@media(pointer:coarse){.desktop-controls{display:none}.mobile-warning{display:inline}}

    body.mobile .desktop-controls{display:none}body.mobile .mobile-warning{display:inline}
    body{height:100dvh;overscroll-behavior:none}body.mobile #help{display:none}
    #rotate{position:fixed;inset:0;z-index:20;background:#243440;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;gap:18px;flex-direction:column}
    body.mobile.portrait #rotate{display:flex}#rotate svg{width:100px;height:100px;stroke:#e9ba50;fill:none;stroke-width:3}
    #rotate-full{background:#754c87;color:#fff5d3;border:1px solid #fff5d355;border-radius:4px;padding:14px 24px;min-height:48px}
    #rotate p{font-size:22px;margin:0}#rotate small{max-width:280px;color:#c4bfb2;line-height:1.6}
    #touch-ui{display:none;position:fixed;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none}
    body.mobile[data-game=RUNNING]:not(.portrait) #touch-ui{display:block}
    .touch-button{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid #fff5d388;color:#fff5d3;background:#24344080;font-size:18px;touch-action:none}
    .touch-button.held{background:#e9ba50aa;color:#243440}
    #fire{width:92px;height:92px;right:max(24px,env(safe-area-inset-right));bottom:max(42px,env(safe-area-inset-bottom));font-size:22px}
    #jump{right:max(134px,calc(env(safe-area-inset-right) + 110px));bottom:28px}#reload{right:max(32px,env(safe-area-inset-right));bottom:154px}
    #pause{right:max(24px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;font-size:16px}
    #stick{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:35px;width:120px;height:120px;border:2px solid #fff5d355;border-radius:50%;background:#24344030;pointer-events:none}
    #stick span{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:#fff5d366}
    #immersive{display:none;position:fixed;z-index:7;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));background:#243440bd;color:#fff5d3;border:1px solid #fff5d366;padding:10px 14px}
    body.mobile:not([data-game=RUNNING]):not(.portrait) #immersive{display:block}
    #immersive-note{display:none;position:fixed;z-index:21;left:10%;right:10%;bottom:12px;text-align:center;background:#243440e8;padding:12px;font-size:13px;color:#fff5d3}
    @media(max-height:500px) and (orientation:landscape){#loading{padding:16px 24px}.card{width:min(560px,100%);display:grid;grid-template-columns:140px 1fr;column-gap:28px;align-items:center}h1{grid-row:1 / 5;margin:0;font-size:58px}.progress-label{margin:0 0 8px}.controls{margin:14px 0 0}.actions{margin-top:12px}}
    @media(prefers-reduced-motion:reduce){#loading{transition:none}}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="No-Art-FPS 游戏画面"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <h1><span>NO</span><span>ART</span><span class="accent">FPS</span></h1>
      <div class="progress-label"><span id="phase">正在加载游戏</span><span id="amount"></span></div>
      <progress id="progress" aria-label="游戏资源下载进度"></progress>
      <p class="controls"><span class="desktop-controls">WASD 移动 · 鼠标瞄准 · 左键开火<br>空格跳跃 · R 换弹 · Esc 暂停</span><span class="mobile-warning">横屏操作 · 左侧移动 · 右侧滑动瞄准<br>按住开火 · 点按跳跃与换弹</span></p>
      <div class="actions"><button id="retry" hidden>重新加载</button><a href="https://cv.yicong.me" rel="noopener">pixelcao ↗</a></div>
    </div>
  </div>
  <div id="help" hidden><span class="desktop-controls">WASD 移动 · 鼠标瞄准 · 左键开火 · Esc 暂停</span><span class="mobile-warning">左侧移动 · 右侧瞄准</span></div>

  <div id="rotate"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="28" y="13" width="44" height="74" rx="7" transform="rotate(30 50 50)"/><path d="M8 48a42 42 0 0 1 70-30m0-12v12H65M92 52a42 42 0 0 1-70 30m0 12V82h13"/></svg><p>横过来，准备开火</p><small>左手移动，右手瞄准</small><button id="rotate-full">横屏全屏</button></div>
  <button id="immersive" aria-label="进入沉浸全屏">⛶ 全屏</button><div id="immersive-note" role="status"></div>
  <div id="touch-ui" aria-label="触控操作"><div id="stick"><span></span></div><button class="touch-button" id="fire" aria-label="按住开火">◎</button><button class="touch-button" id="jump" aria-label="跳跃">↑</button><button class="touch-button" id="reload" aria-label="换弹">↻</button><button class="touch-button" id="pause" aria-label="暂停">Ⅱ</button></div>
  <script>
    window.noArtMobile=matchMedia('(pointer:coarse)').matches||new URLSearchParams(location.search).has('touch');
    const touch={x:0,y:0,dx:0,dy:0,fire:false,jump:false,reload:false,pause:false,blocked:false};
    let pauseRequested=false;
    const fingers=new Map(),ui=document.querySelector('#touch-ui'),knob=document.querySelector('#stick span');
    function clearTouch(){fingers.clear();Object.assign(touch,{x:0,y:0,dx:0,dy:0,fire:false,jump:false,reload:false,pause:false});knob.style.transform='';document.querySelectorAll('.held').forEach(e=>e.classList.remove('held'));}
    function orientation(){const portrait=innerHeight>innerWidth;document.body.classList.toggle('portrait',portrait);touch.blocked=portrait||document.hidden;if(portrait){clearTouch();pauseRequested=true;}}
    document.body.classList.toggle('mobile',window.noArtMobile);orientation();window.addEventListener('resize',()=>{clearTouch();orientation();});
    document.addEventListener('visibilitychange',()=>{clearTouch();orientation();if(document.hidden)pauseRequested=true;});window.addEventListener('blur',()=>{clearTouch();if(document.body.dataset.game==='RUNNING')pauseRequested=true;});
    window.noArtState=state=>{document.body.dataset.game=state;clearTouch();if(state!=='RUNNING')pauseRequested=false;};
    window.noArtReadTouch=()=>{const result=JSON.stringify({...touch,pause:touch.pause||pauseRequested});pauseRequested=false;touch.dx=touch.dy=0;touch.jump=touch.reload=touch.pause=false;return result;};
    ui.addEventListener('contextmenu',e=>e.preventDefault());
    ui.addEventListener('pointerdown',e=>{e.preventDefault();ui.setPointerCapture(e.pointerId);const action=e.target.closest('button')?.id;const kind=action||(e.clientX<innerWidth*.4?'move':'look');if([...fingers.values()].some(f=>f.kind===kind))return;fingers.set(e.pointerId,{kind,x:e.clientX,y:e.clientY});if(action){touch[action]=true;e.target.classList.add('held');}});
    ui.addEventListener('pointermove',e=>{const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(f.kind==='move'){const x=(e.clientX-f.x)/50,y=(e.clientY-f.y)/50,length=Math.max(1,Math.hypot(x,y));touch.x=x/length;touch.y=y/length;knob.style.transform=`translate(${touch.x*36}px,${touch.y*36}px)`;}else if(f.kind==='look'||f.kind==='fire'){touch.dx+=e.clientX-f.x;touch.dy+=e.clientY-f.y;f.x=e.clientX;f.y=e.clientY;}});
    function release(e){const f=fingers.get(e.pointerId);if(!f)return;fingers.delete(e.pointerId);if(f.kind==='move'){touch.x=touch.y=0;knob.style.transform='';}if(f.kind==='fire')touch.fire=false;document.getElementById(f.kind)?.classList.remove('held');}
    for(const event of ['pointerup','pointercancel','lostpointercapture'])ui.addEventListener(event,release);
    async function immersive(){try{if(!document.fullscreenElement){const method=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(!method)throw Error('unsupported');await method.call(document.documentElement);}try{await screen.orientation?.lock('landscape');}catch{}}catch{const note=document.querySelector('#immersive-note');note.textContent='此浏览器无法隐藏工具栏；可通过“分享 → 添加到主屏幕”以独立窗口打开。';note.style.display='block';setTimeout(()=>note.style.display='none',6000);}}
    document.querySelector('#immersive').onclick=immersive;document.querySelector('#rotate-full').onclick=immersive;
    let attempted=false;document.querySelector('#canvas').addEventListener('pointerdown',()=>{if(window.noArtMobile&&!attempted){attempted=true;immersive();}},{capture:true});
    document.addEventListener('fullscreenchange',()=>{clearTouch();if(!document.fullscreenElement&&document.body.dataset.game==='RUNNING')pauseRequested=true;});
  </script>
  <noscript>请启用 JavaScript 后再试玩 No-Art-FPS。</noscript>
  <script>
    const loading=document.querySelector('#loading'),phase=document.querySelector('#phase'),amount=document.querySelector('#amount'),progress=document.querySelector('#progress'),retry=document.querySelector('#retry'),help=document.querySelector('#help');
    let ready=false,failed=false;
    retry.addEventListener('click',()=>location.reload());
    function fail(message){if(failed)return;failed=true;loading.hidden=false;loading.classList.remove('leaving');phase.textContent=message;amount.textContent='';progress.hidden=true;retry.hidden=false;}
    window.noArtReady=()=>{if(ready||failed)return;ready=true;phase.textContent='准备就绪';progress.value=1;progress.max=1;amount.textContent='';loading.classList.add('leaving');setTimeout(()=>{loading.hidden=true;help.hidden=false;},200);};
    document.addEventListener('pointerlockchange',()=>{help.hidden=Boolean(document.pointerLockElement)||!ready;});
    document.querySelector('#canvas').addEventListener('contextmenu',event=>event.preventDefault());
    window.addEventListener('unhandledrejection',event=>{if(!ready)fail('加载遇到问题，请重试');});
    function launch(){
      const missing=Engine.getMissingFeatures({threads:false});
      if(missing.length){fail('此浏览器不支持运行游戏，请使用新版 Chrome 或 Firefox');return;}
      const config=$GODOT_CONFIG;
      config.canvas=document.querySelector('#canvas');
      config.onProgress=(current,total)=>{
        if(failed||ready)return;
        if(current>0&&total>0){progress.max=total;progress.value=current;amount.textContent=`${Math.min(100,Math.floor(current/total*100))}%`;phase.textContent=current>=total?'正在准备场景':'正在加载游戏';}
        else{progress.removeAttribute('value');amount.textContent=current>0?`${(current/1048576).toFixed(1)} MB`:'';}
      };
      config.onPrintError=(...args)=>{console.error(...args);if(!ready&&args.some(value=>String(value).includes('SCRIPT ERROR')))fail('场景初始化失败，请重试');};
      config.onExit=()=>fail('游戏已退出');
      const engine=new Engine(config);
      engine.startGame().then(()=>{if(!ready&&!failed){phase.textContent='正在准备场景';progress.removeAttribute('value');amount.textContent='';}}).catch(error=>{console.error(error);fail('游戏加载失败，请检查网络后重试');});
    }
    const script=document.createElement('script');script.src='$GODOT_URL';script.onload=launch;script.onerror=()=>fail('游戏加载失败，请检查网络后重试');document.body.appendChild(script);
  </script>
</body>
</html>
