<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沙门场景模型进化</title><style>
body{margin:0;background:#18232c;color:#eef4f5;font:16px/1.65 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}p{max-width:960px;color:#b9c9d1}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#2d4352;color:inherit;border:1px solid #638292;padding:10px 16px;cursor:pointer;border-radius:5px}button[aria-pressed=true]{background:#087b83;border-color:#4bc3bf}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{width:100%;display:block}figcaption{padding:6px 0}section{margin:30px 0}a{color:#77d5dd}@media(max-width:850px){.pair{grid-template-columns:1fr}}
</style><main><h1>沙门：从附加细节到真实深度</h1><p>固定机位、1440 × 810、FOV 63°，保持天空、太阳、材质色板、玩法与碰撞布局。比较近景商铺窗洞、连续曲面棚布及长门拱圈。</p>
<nav aria-label="对照类型"><button aria-pressed="true" data-mode="final">最终实机</button><button aria-pressed="false" data-mode="geometry">仅几何对照：双方均不带顶点烘焙</button></nav>
<p id="note">最终实机包括随新几何重新生成的顶点遮蔽与反弹光。要判断模型本身的收益，请切换到仅几何对照。</p>
<div id="views"></div><p><a href="README.md">实现、验证和性能记录</a> · <a href="../README.md">全部地图进度</a></p></main><script>
const views=[['combat','正常战斗距离'],['near','近距离窗洞与摊棚'],['side','沿街侧视'],['gate','长门拱圈']];
function show(mode){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));document.getElementById('note').textContent=mode==='geometry'?'双方均由对应版本生成器重新导出，均不含顶点光照颜色；太阳、材质与环境保持一致。':'最终实机包括随新几何重新生成的顶点遮蔽与反弹光。要判断模型本身的收益，请切换到仅几何对照。';document.getElementById('views').innerHTML=views.map(([id,title])=>`<section><h2>${title}</h2><div class="pair">${['before','after'].map((phase,i)=>`<figure><img src="${phase}${mode==='geometry'?'-geometry':''}/${id}.png" alt="${title}，${i?'改造后':'改造前'}"><figcaption>${i?'改造后':'改造前'}</figcaption></figure>`).join('')}</div></section>`).join('')};document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('final');
</script></html>
