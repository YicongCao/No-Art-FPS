<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爆头反馈实机样板</title><style>body{max-width:1400px;margin:32px auto;padding:0 24px;background:#18232f;color:#eee;font:16px/1.6 system-ui}h1,h2{color:#ffcf72}video{width:100%;max-height:75vh;background:#111}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;background:#253444;border-radius:8px;overflow:hidden}img{display:block;width:100%}figcaption{padding:8px 12px}a{color:#ffcf72}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>头甲崩开，核心闪灭</h1><p>toy 分支首版；以下均为 Godot 实机渲染。短片为实际射击、60 fps 正常速度；顺序是步枪兵身体命中、步枪兵爆头、突击兵身体命中、突击兵爆头。</p><video controls preload="metadata" src="headshot-demo.mp4"></video><p>静帧通过固定姿态触发相同伤害事件并推进指定时间，用于检查形状；独立测试覆盖真实子弹的判定。<a href="README.md">实现、验证与性能说明</a></p><h2>步枪兵</h2><section><figure><img loading="lazy" src="renders/rifleman-before.png" alt="步枪兵：命中前"><figcaption>命中前</figcaption></figure><figure><img loading="lazy" src="renders/rifleman-body.png" alt="步枪兵：身体命中后 50 ms"><figcaption>身体命中后 50 ms</figcaption></figure><figure><img loading="lazy" src="renders/rifleman-head-33.png" alt="步枪兵：爆头后 33 ms：短闪与外壳崩开"><figcaption>爆头后 33 ms：短闪与外壳崩开</figcaption></figure><figure><img loading="lazy" src="renders/rifleman-head-100.png" alt="步枪兵：爆头后 100 ms：壳片分离、开始侧倒"><figcaption>爆头后 100 ms：壳片分离、开始侧倒</figcaption></figure><figure><img loading="lazy" src="renders/rifleman-head-220.png" alt="步枪兵：爆头后 220 ms：准星确认结束"><figcaption>爆头后 220 ms：准星确认结束</figcaption></figure><figure><img loading="lazy" src="renders/rifleman-head-650.png" alt="步枪兵：爆头后 650 ms：碎片回收"><figcaption>爆头后 650 ms：碎片回收</figcaption></figure></section><h2>突击兵</h2><section><figure><img loading="lazy" src="renders/rusher-before.png" alt="突击兵：命中前"><figcaption>命中前</figcaption></figure><figure><img loading="lazy" src="renders/rusher-body.png" alt="突击兵：身体命中后 50 ms"><figcaption>身体命中后 50 ms</figcaption></figure><figure><img loading="lazy" src="renders/rusher-head-33.png" alt="突击兵：爆头后 33 ms：短闪与外壳崩开"><figcaption>爆头后 33 ms：短闪与外壳崩开</figcaption></figure><figure><img loading="lazy" src="renders/rusher-head-100.png" alt="突击兵：爆头后 100 ms：壳片分离、开始侧倒"><figcaption>爆头后 100 ms：壳片分离、开始侧倒</figcaption></figure><figure><img loading="lazy" src="renders/rusher-head-220.png" alt="突击兵：爆头后 220 ms：准星确认结束"><figcaption>爆头后 220 ms：准星确认结束</figcaption></figure><figure><img loading="lazy" src="renders/rusher-head-650.png" alt="突击兵：爆头后 650 ms：碎片回收"><figcaption>爆头后 650 ms：碎片回收</figcaption></figure></section><h2>远距离辨识</h2><section><figure><img loading="lazy" src="renders/head-15m.png" alt="15 米爆头确认"><figcaption>15 米：世界闪光保持头部尺度，准星提供清晰确认</figcaption></figure><figure><img loading="lazy" src="renders/head-25m.png" alt="25 米爆头确认"><figcaption>25 米：世界闪光保持头部尺度，准星提供清晰确认</figcaption></figure></section></html>
