<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#e6ece9"/><text x="35" y="45" font-size="25" fill="#1d3e50">MOONBASE / EXTERIOR SITE PLAN v1.1</text><text x="35" y="76" font-size="14" fill="#5c7680">44 × 48 m / X east, Z south / dimensions in metres / proposed greybox, not a measured built map</text><defs><pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#c7d4d3" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b95e3a"/></marker></defs><rect x="162" y="94" width="616" height="672" fill="url(#grid)" stroke="#395f70" stroke-width="2"/><rect x="274.0" y="108.0" width="392" height="70" rx="4" fill="#cad0c4" stroke="#345768" stroke-width="1.3"/><text x="470" y="143.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A02 / CLOSED BASE</text><rect x="274.0" y="178.0" width="392" height="42" rx="4" fill="#bdc9ca" stroke="#345768" stroke-width="1.3"/><text x="470" y="199.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">EXTERIOR DECK  Y=2.4</text><rect x="428.0" y="220.0" width="42" height="112" rx="4" fill="#b0c1c8" stroke="#345768" stroke-width="1.3"/><text x="449.0" y="276" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">RAMP</text><rect x="519.0" y="220.0" width="42" height="112" rx="4" fill="#b0c1c8" stroke="#345768" stroke-width="1.3"/><text x="540" y="276" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">RAMP</text><rect x="211.0" y="318.0" width="168" height="196" rx="4" fill="#9fb8c2" stroke="#345768" stroke-width="1.3"/><text x="295.0" y="416" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A01 / SHIP</text><rect x="648.5" y="248.0" width="91.0" height="84" rx="4" fill="#b6c7bc" stroke="#345768" stroke-width="1.3"/><text x="694" y="290" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A03 / O2</text><rect x="641.5" y="438.4" width="105.0" height="39.199999999999996" rx="4" fill="#b6c7bc" stroke="#345768" stroke-width="1.3"/><text x="694" y="458" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A04</text><rect x="715.0" y="192.0" width="42" height="28" rx="4" fill="#8faaba" stroke="#345768" stroke-width="1.3"/><text x="736" y="206" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A07</text><rect x="659.0" y="377.5" width="70" height="21.0" rx="4" fill="#d4bd91" stroke="#345768" stroke-width="1.3"/><text x="694" y="388" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A12</text><rect x="302.0" y="615.5" width="84" height="49.0" rx="4" fill="#d0c7b4" stroke="#345768" stroke-width="1.3"/><text x="344" y="640" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A08 / CARGO</text><rect x="564.5" y="612.0" width="91.0" height="56" rx="4" fill="#d0c7b4" stroke="#345768" stroke-width="1.3"/><text x="610" y="640" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">A05 / SERVICE</text><rect x="421.0" y="396.4" width="42" height="11.200000000000001" rx="4" fill="#b9c2b8" stroke="#345768" stroke-width="1.3"/><text x="442" y="402" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">COVER</text><rect x="506.4" y="479.0" width="11.200000000000001" height="42" rx="4" fill="#b9c2b8" stroke="#345768" stroke-width="1.3"/><text x="512" y="500" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">COVER</text><rect x="393.0" y="550.4" width="42" height="11.200000000000001" rx="4" fill="#b9c2b8" stroke="#345768" stroke-width="1.3"/><text x="414" y="556" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#203f50">COVER</text><polyline points="186.5,668 186.5,290 403.5,290 403.5,360 470,360 568,360 596,416 596,542 512,584 470,654 414,703.0 246,703.0 186.5,703.0 186.5,668" fill="none" stroke="#bd603a" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/><circle cx="470" cy="682" r="13" fill="#507e7d"/><text x="470" y="686" text-anchor="middle" font-size="10" fill="white">P</text><circle cx="232" cy="192" r="13" fill="#a66a50"/><text x="232" y="196" text-anchor="middle" font-size="10" fill="white">E1</text><circle cx="470" cy="206" r="13" fill="#a66a50"/><text x="470" y="210" text-anchor="middle" font-size="10" fill="white">E2</text><circle cx="624" cy="234" r="13" fill="#a66a50"/><text x="624" y="238" text-anchor="middle" font-size="10" fill="white">E3</text><circle cx="708" cy="612" r="13" fill="#a66a50"/><text x="708" y="616" text-anchor="middle" font-size="10" fill="white">E4</text><path d="M162 430H211.0" stroke="#466d78" stroke-width="2"/><text x="186.5" y="422" text-anchor="middle" font-size="10" fill="#33596b">3.5 m</text><text x="850" y="135" font-size="14" fill="#a3492b">LOCKED INTENT</text><text x="850" y="159" font-size="13" fill="#345667">Base interior is closed. Windows use dark backing.</text><text x="850" y="200" font-size="14" fill="#a3492b">MAIN ROUTE</text><text x="850" y="224" font-size="13" fill="#345667">3.5–5 m main path; 3 m service paths.</text><text x="850" y="265" font-size="14" fill="#a3492b">SHIP WEST GAP</text><text x="850" y="289" font-size="13" fill="#345667">X=-22 to -18.5 = 3.5 m at this proxy size.</text><text x="850" y="330" font-size="14" fill="#a3492b">RAMP DATUM</text><text x="850" y="354" font-size="13" fill="#345667">Deck top Y=2.4; run 8 m; rise 2.4 m.</text><text x="850" y="395" font-size="14" fill="#a3492b">PIPE BRIDGE</text><text x="850" y="419" font-size="13" fill="#345667">Under-beam target &gt;=3.8 m; test real jump.</text><text x="850" y="460" font-size="14" fill="#a3492b">LOW COVER</text><text x="850" y="484" font-size="13" fill="#345667">0.9–1.2 m; destruction keeps the main shell.</text><text x="850" y="525" font-size="14" fill="#a3492b">BOUNDARY</text><text x="850" y="549" font-size="13" fill="#345667">Low wall + visible rock/cliff closure, no fake exit.</text><text x="850" y="590" font-size="14" fill="#a3492b">SPAWNS</text><text x="850" y="614" font-size="13" fill="#345667">P/E marks are candidates; retain fair spawn checks.</text><text x="850" y="655" font-size="14" fill="#a3492b">REFERENCE VIEWS</text><text x="850" y="679" font-size="13" fill="#345667">C0 (-3,1.65,16), C1 (-17,1.65,9),</text><text x="850" y="720" font-size="14" fill="#a3492b"></text><text x="850" y="744" font-size="13" fill="#345667">C2 (10,1.65,7); validate camera clearance.</text><text x="160" y="820" font-size="14" fill="#355c6c">Orange dashes: intended route, not navigation bake. Green/Brown circles: candidate spawns.</text><text x="160" y="855" font-size="14" fill="#355c6c">A06 antenna: base roof. A10 perimeter and A11 pad omitted as full geometry to keep plan legible.</text><text x="160" y="890" font-size="14" fill="#355c6c">Do not auto-place full A09 assemblies repeatedly; place individual cover units and retest sight lines.</text></svg>