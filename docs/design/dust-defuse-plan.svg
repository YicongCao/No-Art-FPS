<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">风味 Dust2 三目标拆弹任务方案</title>
  <desc id="desc">原创概念图，非地图尺寸或实作点位。玩家从连接区出发，任意顺序拆除 A 平台、小道凹位和 CT 院落的三颗 C4。任务建议先取三分钟，死亡或超时失败。巡逻区域与多条接近路线分开表示。</desc>
  <rect width="1200" height="760" fill="#f4f0e7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#243440">
    <text x="48" y="62" font-size="30" font-weight="700">风味 Dust2：三颗 C4，限时拆除并存活</text>
    <text x="48" y="96" font-size="17" fill="#59626a">建议首版 180 秒 · 任意拆除顺序 · 点位与连线为概念，不是实测平面图</text>
    <rect x="48" y="128" width="700" height="480" rx="12" fill="#fffdf8" stroke="#c4bfb2"/>
    <g stroke="#d5b471" stroke-width="18" fill="none" stroke-linejoin="round">
      <path d="M230 519 L160 399 L160 248 L360 214 L610 228 L610 419 L400 519 L230 519"/>
      <path d="M230 519 L360 392 L360 214"/>
      <path d="M360 392 L610 419"/>
    </g>
    <g fill="none" stroke-width="2" stroke-dasharray="6 7">
      <path d="M118 270 L199 289 L199 373 L119 359 Z" stroke="#754c87"/>
      <path d="M304 174 L410 174 L441 256 L324 264 Z" stroke="#b65745"/>
      <path d="M560 358 L655 367 L682 471 L561 477 Z" stroke="#4d7d70"/>
    </g>
    <g fill="#e5e0d2" stroke="#243440" stroke-width="2">
      <rect x="302" y="189" width="116" height="50" rx="7" fill="#f1d9cb"/>
      <rect x="100" y="227" width="120" height="50" rx="7" fill="#e8dcf0"/>
      <rect x="550" y="393" width="120" height="50" rx="7" fill="#dce8df"/>
      <rect x="297" y="367" width="126" height="50" rx="7"/>
      <rect x="549" y="202" width="123" height="50" rx="7"/>
      <rect x="170" y="494" width="120" height="50" rx="7" fill="#304f9d"/>
    </g>
    <g font-size="18" font-weight="600" text-anchor="middle">
      <text x="360" y="221">A 平台</text><text x="160" y="259">小道凹位</text>
      <text x="610" y="425">CT 院落</text><text x="360" y="399">连接区</text>
      <text x="610" y="234">大道 / 低坑</text><text x="230" y="526" fill="#fff8e8">玩家起点</text>
    </g>
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#243440">
      <rect x="344" y="144" width="74" height="30" rx="5" fill="#f2d084"/><text x="381" y="165">C4 甲</text>
      <rect x="79" y="191" width="74" height="30" rx="5" fill="#f2d084"/><text x="116" y="212">C4 乙</text>
      <rect x="644" y="448" width="74" height="30" rx="5" fill="#f2d084"/><text x="681" y="469">C4 丙</text>
    </g>
    <text x="78" y="580" font-size="16" fill="#59626a">虚线表示巡逻覆盖区 · 实线表示候选路线 · 掩体与拆除视线需白模检验</text>
    <rect x="776" y="128" width="376" height="480" rx="12" fill="#243440"/>
    <g fill="#fff8e8">
      <text x="804" y="172" font-size="22" font-weight="600">任务规则</text>
      <text x="804" y="216" font-size="18">三颗拆完立即成功</text>
      <text x="804" y="250" font-size="18">阵亡或超时失败，无复活</text>
      <text x="804" y="284" font-size="18">按住交互，受伤或离开即取消</text>
      <text x="804" y="334" font-size="20" fill="#f2d084">地图转换变化</text>
      <text x="804" y="372" font-size="17">建筑保持静态，导航预烘焙</text>
      <text x="804" y="405" font-size="17">C4 与巡逻路点独立保存</text>
      <text x="804" y="438" font-size="17">有限守卫，不持续补兵</text>
      <text x="804" y="471" font-size="17">按任务路径预算调整长路线</text>
      <text x="804" y="529" font-size="17" fill="#f2d084">旧图仍是 60 秒击杀竞技场</text>
      <text x="804" y="562" font-size="16" fill="#c4bfb2">复活、DESTROY 与引爆归旧玩法</text>
    </g>
    <text x="48" y="654" font-size="22" font-weight="600">先做可完成的任务白模，再做装饰</text>
    <text x="48" y="691" font-size="18">验证任意顺序可达、巡逻有可观察的窗口、死亡和截止只结算一次、重试恢复三个目标。</text>
    <text x="48" y="724" font-size="16" fill="#59626a">180 秒、约 5 秒拆除、8–12 名守卫为待试玩参数；用户要求范围为 2–3 分钟。</text>
  </g>
</svg>
