<text x="70" y="815" class="small">每小格 2 m；图中块体均为实心。入口外预留隐藏预备区。</text>
<text x="850" y="193" class="title">路线与交战</text>
<text x="850" y="240" class="body">外圈：持续跑动，不进死胡同</text>
<text x="850" y="278" class="body">中央：错位遮挡，穿插换目标</text>
<text x="850" y="316" class="body">高台：两侧可上，不能看遍全场</text>
<text x="850" y="354" class="body">主要交战距离：8–20 m</text>
<text x="850" y="392" class="body">主要通道净宽：3–4 m</text>
<text x="850" y="461" class="title">六个入口 / 动态补员</text>
<text x="850" y="509" class="body">入口 1–6：遮挡后出生，走入场地</text>
<text x="850" y="547" class="body">距离、视线、导航可达均需检查</text>
<text x="850" y="585" class="body">同时目标数起始按 4 → 6 → 8</text>
<text x="850" y="623" class="body">头部轮廓清楚，转身能找到目标</text>
<text x="850" y="708" class="title">先验证的三个问题</text>
<text x="850" y="752" class="body">① 是否经常连续 2 秒找不到目标？</text>
<text x="850" y="790" class="body">② 是否站在某个角落就能刷最高分？</text>
<text x="850" y="828" class="body">③ 换弹时是否自然发生转移？</text>
<text x="70" y="886" class="small">提案 v0.1 · 2026-11-05 · 颜色表示区域与结构，不代表最终材质</text>
