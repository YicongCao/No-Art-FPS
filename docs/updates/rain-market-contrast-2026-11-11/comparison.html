<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨市实机改造对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#12212b;color:#edf0e9;font:16px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,a{color:inherit}button{background:#233c4b;border:1px solid #587381;padding:8px 16px;cursor:pointer;border-radius:5px}button[aria-pressed=true]{background:#795729;border-color:#f1ca83}.frame{position:relative;aspect-ratio:16/9;background:#000}.frame img{position:absolute;width:100%;height:100%;object-fit:contain}.frame .after{clip-path:inset(0 0 0 50%)}.divider{position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #f5d18a;pointer-events:none}.labels{display:flex;justify-content:space-between;font-size:14px}input{width:100%;accent-color:#eabe71}p{color:#bdc9ce}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f3ce80;outline-offset:3px}</style><main><h1>雨市：首版与光照修正版</h1><p>同一项目、同一相机与布局。这里展示 Godot 实际渲染，不是 Imagegen 概念图。</p><nav id="views"></nav><div class="labels"><span>上一版</span><span>本次修正</span></div><div class="frame"><img id="before" alt="上一版实机截图"><img id="after" class="after" alt="本次修正实机截图"><div class="divider"></div></div><label for="split">拖动比较边界</label><input id="split" type="range" min="0" max="100" value="50"><p><a href="README.md">验证、性能与发布记录</a></p></main><script>
const shots={'wet-aisle':'主通道','fish-crossing':'鱼摊入口','upper-crossing':'上层通道','service-frenzy':'狂暴阶段'};const a=document.querySelector('#after'),b=document.querySelector('#before');function select(key){a.src='after/'+key+'.png';b.src='../rain-market-2026-11-11/after/'+key+'.png';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.key===key)))}for(const [key,text]of Object.entries(shots)){const x=document.createElement('button');x.textContent=text;x.dataset.key=key;x.onclick=()=>select(key);document.querySelector('#views').append(x)}document.querySelector('#split').oninput=e=>{a.style.clipPath=`inset(0 0 0 ${e.target.value}%)`;document.querySelector('.divider').style.left=e.target.value+'%'};select('wet-aisle');</script></html>
